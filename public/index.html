<style>

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body,#root { height:100%; width:100%; overflow:hidden; }
body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:17px; transition:background 0.3s,color 0.3s; }
#root { display:flex; flex-direction:column; max-width:480px; margin:0 auto; }
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:#1e293b; border-radius:2px; }
.font-display { font-family:'Plus Jakarta Sans',sans-serif; }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

@keyframes spin { to{transform:rotate(360deg)} }

@keyframes conquestPop { 0%{transform:scale(0.5);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }

.scroll-area { flex:1; overflow-y:auto; overflow-x:hidden; padding:20px 16px; -webkit-overflow-scrolling:touch; }

.grad-gold { background:linear-gradient(135deg,#fde68a,#f59e0b); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

.toast { position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:rgba(10,20,40,0.95); border:1px solid rgba(6,182,212,0.4); border-radius:12px; padding:11px 18px; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:700; color:#67e8f9; z-index:2000; white-space:normal; width:max-content; max-width:calc(100% - 32px); text-align:center; line-height:1.45; animation:fadeUp 0.2s ease; pointer-events:none; backdrop-filter:blur(12px); }

.building-slot { width:60px; height:60px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; border:1px dashed rgba(51,65,85,0.5); background:rgba(15,23,42,0.4); transition:all 0.2s; }

<body>
<div id="root"></div>
<script src="lib/pdf2md.js"></script>

<script src="art/city-art.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ═══ CONSTANTS ═══
const APP_VERSION = '3.8';
const READ = { FAST_WPM:300, MAX_WPM:450, EST_WPM:200, COVERAGE:0.9, CHECK_MIN:360, CHECK_MAX:600, PASS:2, PERFECT_BONUS:5 };
const MODELS = { haiku:'claude-haiku-4-5-20251001', sonnet:'claude-sonnet-4-6' };
const TOKENS = { READ_CHAPTER:10, QUIZ_PASS:5, FEYNMAN:20, FLASHCARD:2, REVIEW_ONTIME:4, STREAK_STEP:5, STREAK_MAX:50, READ_MINUTE:1, READ_MINUTE_CAP:30, BOOK_DONE:200, VOICE_FEYNMAN:10 };

// ═══ MUNDO — datos en art/world-data.js ═══
const EUROPEAN_COUNTRIES = WORLD_COUNTRIES; // compatibilidad
const COUNTRY_BUILDINGS = WORLD_BUILDINGS;
const LEVEL_MULT = [0, 1, 1.5, 2], MAX_LVL = 3;
const levelCost = (bid, lvl) => Math.round((WORLD_BUILDINGS[bid]?.cost || 0) * LEVEL_MULT[lvl]);
const countryLevels = (city, c) => c.buildings.reduce((a, b) => a + (((city || {})[c.id] || {})[b] || 0), 0);
const countryPct = (city, c) => Math.round(countryLevels(city, c) / (c.buildings.length * MAX_LVL) * 100);
const MILESTONES = [ { pct:50, bonus:100, label:'¡Mitad construida!' }, { pct:75, bonus:150, label:'¡Casi lista!' }, { pct:100, bonus:500, label:'¡Conquista!' } ];
const continentUnlocked = (ct, conquests) => !ct || !ct.unlock || WORLD_COUNTRIES.filter(c => c.continent === ct.unlock.from && (conquests || []).includes(c.id)).length >= ct.unlock.conquests;

// ═══ STORAGE — triple-layer: localStorage + sessionStorage + cookie (iOS PWA safe) ═══
const LS = {
  get(k, d=null) {
    try { const v=localStorage.getItem(k); if(v!==null) return JSON.parse(v); } catch {}
    try { const v=sessionStorage.getItem(k); if(v!==null) return JSON.parse(v); } catch {}
    try {
      const m=document.cookie.match(new RegExp('(?:^|; )sq_c_'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'=([^;]*)'));
      if(m) return JSON.parse(decodeURIComponent(m[1]));
    } catch {}
    return d;
  },
  set(k, v) {
    const s = JSON.stringify(v);
    try { localStorage.setItem(k, s); } catch {}
    try { sessionStorage.setItem(k, s); } catch {}
    // Critical keys also in cookie (1 year) — survives iOS PWA restarts
    const critical = ['sq_apikey','sq_pin','sq_tokens','sq_theme','sq_conquests'];
    if(critical.includes(k)) {
      try {
        const exp = new Date(Date.now()+365*24*60*60*1000).toUTCString();
        document.cookie = 'sq_c_'+k+'='+encodeURIComponent(s)+'; expires='+exp+'; path=/; SameSite=Lax';
      } catch {}
    }
  },
};

// ═══ API ═══
async function callClaude({apiKey,model,system,messages,max_tokens=1024}) {
  const res = await fetch("/api/claude",{
    method:"POST",
    headers:Object.assign({"Content-Type":"application/json"},(apiKey||LS.get('sq_apikey',''))?{"X-Api-Key":apiKey||LS.get('sq_apikey','')}:{},LS.get('sq_pin','')?{"X-App-Pin":LS.get('sq_pin','')}:{}),
    body:JSON.stringify({model,max_tokens,system,messages}),
  });
  if(!res.ok){
    const e=await res.json().catch(()=>({error:{message:"Error"}}));
    const msg=e.error?.message||`HTTP ${res.status}`;
    if(/x-api-key|authentication|api key/i.test(msg)){
      const local=!!LS.get('sq_apikey','');
      throw new Error(local&&e.via!=='server'
        ? 'La API key guardada en Config no es válida. Bórrala en Config o cámbiala por una nueva.'
        : 'La clave de Anthropic guardada en Netlify no es válida. Crea una nueva en platform.claude.com → API Keys, guárdala en Netlify (ANTHROPIC_API_KEY) y vuelve a publicar.');
    }
    if(/credit|billing|balance/i.test(msg)) throw new Error('Sin saldo en Anthropic: recarga créditos en console.anthropic.com → Billing.');
    throw new Error(msg);
  }
  const data=await res.json();
  return data.content[0].text;
}

// ═══ PROMPTS ═══
const PROMPTS = {
  comprehension:(text)=>{
    const t=text.replace(/\s+/g,' '), n=t.length, seg=1300;
    const parts=n<=seg*3?[t]:[t.slice(0,seg),t.slice(Math.floor(n/2-seg/2),Math.floor(n/2+seg/2)),t.slice(n-seg)];
    return { model:MODELS.haiku, max_tokens:900,
      system:`Eres examinador de comprensión lectora. Crea 3 preguntas de opción múltiple sobre DETALLES CONCRETOS del texto (hechos, ejemplos, nombres, cifras, argumentos) que solo puede responder quien lo leyó; nada de cultura general. Una pregunta por cada fragmento si hay varios. 4 opciones plausibles, una correcta. Responde en español. SOLO JSON: {"questions":[{"q":"...","options":["...","...","...","..."],"correct":0,"why":"cita breve del texto"}]}`,
      messages:[{role:'user',content:parts.map((p,i)=>`FRAGMENTO ${i+1}:\n${p}`).join('\n\n')}] };
  },
  translate:(text)=>({ model:MODELS.haiku, system:`Eres traductor académico inglés→español. Traduce con precisión. SOLO texto traducido en párrafos.`, messages:[{role:'user',content:`Traduce:\n\n${text}`}], max_tokens:2048 }),

function splitIntoChapters(text) {
  const patterns=[/\n\s*(Chapter\s+\d+[.:)—]?\s*[^\n]*)\n/gi,/\n\s*(CHAPTER\s+\d+[.:)—]?\s*[^\n]*)\n/g,/\n\s*(Capítulo\s+\d+[.:)—]?\s*[^\n]*)\n/gi,/\n\s*(PART\s+[IVXLC\d]+[.:)—]?\s*[^\n]*)\n/gi,/\n\s*(\d+\.\s+[A-Z][^\n]{3,60})\n/g];
  let chapters=[];
  for(const p of patterns){const m=[...text.matchAll(p)];if(m.length>=2){for(let i=0;i<m.length;i++){const s=m[i].index+m[i][0].length,e=i+1<m.length?m[i+1].index:text.length,c=text.slice(s,e).trim();if(c.length>100)chapters.push({id:i,title:m[i][1].trim(),content:c,words:c.split(/\s+/).length});}break;}}
  if(chapters.length<2){const w=text.split(/\s+/),cs=1500;chapters=[];for(let i=0;i<w.length;i+=cs)chapters.push({id:chapters.length,title:`Fragmento ${chapters.length+1}`,content:w.slice(i,i+cs).join(' '),words:Math.min(cs,w.length-i)});}
  return chapters;
}
// ═══ MARKDOWN (.md) — capítulos por encabezados, texto limpio para la IA ═══
function mdToPlain(md){
  return md
    .replace(/\r\n?/g,'\n')
    .replace(/<!--[\s\S]*?-->/g,'')
    .replace(/```[^\n]*\n([\s\S]*?)```/g,'$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,'')
    .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')
    .replace(/<[^>\n]+>/g,'')
    .replace(/^\s{0,3}#{1,6}\s+(.*?)\s*#*\s*$/gm,'$1')
    .replace(/^\s{0,3}>\s?/gm,'')
    .replace(/^\s*[-*+]\s+/gm,'• ')
    .replace(/^\s*([-*_]\s*){3,}$/gm,'')
    .replace(/^\|?(\s*:?-{2,}:?\s*\|)+\s*:?-*:?\s*\|?\s*$/gm,'')
    .replace(/^\|(.*)\|\s*$/gm,(m,row)=>row.split('|').map(x=>x.trim()).join(' · '))
    .replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g,'$2')
    .replace(/(^|[^\w*])\*(?=\S)([^*\n]*?\S)\*(?![\w*])/g,'$1$2')
    .replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g,'$1$2')
    .replace(/`([^`\n]+)`/g,'$1')
    .replace(/[ \t]+\n/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
function splitMarkdownChapters(md){
  const text=md.replace(/\r\n?/g,'\n').replace(/^﻿/,'').replace(/^---\n[\s\S]*?\n---\n/,'');
  const lines=text.split('\n'); const heads=[]; let inCode=false;
  lines.forEach((ln,i)=>{
    if(/^\s*```/.test(ln)){inCode=!inCode;return;}
    if(inCode) return;
    const m=ln.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
    if(m) heads.push({i,lvl:m[1].length,title:m[2].replace(/[*_`]/g,'').trim()});
  });
  const build=(lvl)=>{
    const hs=heads.filter(h=>h.lvl===lvl); if(hs.length<2) return null;
    const out=[]; let carry='', carryW=0;
    const intro=mdToPlain(lines.slice(0,hs[0].i).join('\n'));
    hs.forEach((h,k)=>{
      const end=k+1<hs.length?hs[k+1].i:lines.length;
      const body=mdToPlain(lines.slice(h.i+1,end).join('\n'));
      const words=body.split(/\s+/).filter(Boolean).length;
      // secciones cortas: se unen al capítulo anterior (o al siguiente si aún no hay ninguno)
      if(words<120 && out.length){ const prev=out[out.length-1]; prev.content+=`\n\n${h.title}\n\n${body}`; prev.words+=words; return; }
      if(words<120){ carry+=`${h.title}\n\n${body}\n\n`; carryW+=words; return; }
      out.push({id:out.length,title:h.title.slice(0,120),content:carry+body,words:words+carryW}); carry=''; carryW=0;
    });
    if(carry && out.length===0 && carryW>0) out.push({id:0,title:hs[0].title.slice(0,120),content:carry.trim(),words:carryW});
    if(out.length && intro.split(/\s+/).length>150) out.unshift({id:-1,title:'Introducción',content:intro,words:intro.split(/\s+/).length});
    out.forEach((c,i)=>c.id=i);
    return out.length>=2?out:null;
  };
  const cands=[1,2,3].map(build).filter(Boolean);
  const good=cands.find(c=>c.length>=3 && c.reduce((a,x)=>a+x.words,0)/c.length<=12000);
  const best=good||cands.sort((a,b)=>b.length-a.length)[0];
  return best||splitIntoChapters('\n'+mdToPlain(text)+'\n');
}

// Heuristic: guess gender from voice name
function guessGender(voiceName) {
  if(VOICE_GENDER[voiceName]) return VOICE_GENDER[voiceName];
  const name = voiceName.toLowerCase();
  const femaleNames = ['monica','lucia','elena','conchita','paulina','angela','maria','sofia','isabel','sara','kate','emily','serena','martha','victoria','fiona','karen','veena','samantha','alex','siri'];

  if(femaleNames.some(n => name.includes(n))) return 'female';
  if(maleNames.some(n => name.includes(n))) return 'male';
  // Last letter heuristic: names ending in 'a' tend to be female
  const firstName = voiceName.split(' ')[0];
  if(/a$/i.test(firstName)) return 'female';
  return 'male';
}

const VOICE_DB = {
  female: ['mónica','monica','paulina','marisol','lucía','lucia','elvira','dalia','salome','salomé','ximena','abril','helena','laura','sabina','elena','isabela','angélica','angelica','soledad','esperanza','francisca','paloma','camila','valentina',
           'samantha','ava','allison','susan','zoe','karen','moira','tessa','serena','kate','victoria','nicky','joelle','aria','jenny','emma','michelle','sonia','libby','natasha','clara','zira','hazel','martha','fiona','catherine','jane','ana','sara','sophia'],
  male:   ['jorge','juan','diego','carlos','álvaro','alvaro','gonzalo','tomás','tomas','pablo','raúl','raul','alonso','jaime','andrés','andres','emilio','federico','gerardo','arnau','dario','darío','enrique',
           'daniel','alex','tom','evan','nathan','aaron','oliver','arthur','rishi','gordon','lee','guy','davis','christopher','eric','andrew','brian','roger','steffan','ryan','thomas','david','mark','george','william','james','liam','noah'],
};
const VOICE_NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|kathy|fred/i;
// Voces 'Eloquence' de iOS: más robóticas, solo como respaldo si faltan voces de ese género
const VOICE_ELOQ = { eddy:'male', reed:'male', rocko:'male', grandpa:'male', abuelo:'male', flo:'female', sandy:'female', shelley:'female', grandma:'female', abuela:'female' };
const VOICE_GENDER = {};
const deaccent=(x)=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const VOICE_DB_N={female:new Set(VOICE_DB.female.map(deaccent)),male:new Set(VOICE_DB.male.map(deaccent))};
function voiceGenderOf(v){
  const n=deaccent(v.name);
  if(/\bfemale\b|femenin|mujer/.test(n)) return 'female';
  if(/\bmale\b|masculin|hombre/.test(n)) return 'male';
  const first=n.replace(/^(microsoft|google|apple)\s+/,'').split(/[\s(,-]/)[0];
  if(VOICE_DB_N.female.has(first)) return 'female';
  if(VOICE_DB_N.male.has(first)) return 'male';
  if(/^google (español|us english)/.test(n)) return 'female';
  return null;
}
function voiceScore(v){
  const n=v.name||''; let sc=10;
  if(/natural|neural/i.test(n)) sc+=40;
  if(/premium/i.test(n)) sc+=35;
  if(/enhanced|mejorad|siri/i.test(n)) sc+=25;
  if(/online/i.test(n)) sc+=8;
  if(/^google/i.test(n)) sc+=12;
  const L=(v.lang||'').replace('_','-');
  if(/^es-(ES|MX|CO|US|419)/i.test(L)) sc+=6;
  if(/^en-(US|GB)/i.test(L)) sc+=6;
  if(/compact/i.test(n)) sc-=10;
  return sc;
}
function curateVoices(all){
  const out=[], baseOf=v=>deaccent(v.name.replace(/\s*\(.*\)\s*$/,'').replace(/^(Microsoft|Google|Apple)\s+/i,'').split(' ')[0]);
  for(const lang of ['es','en']){
    const pool=(all||[]).filter(v=>deaccent(v.lang).startsWith(lang) && !VOICE_NOVELTY.test(deaccent(v.name))).sort((a,b)=>voiceScore(b)-voiceScore(a));
    const used=new Set();
    for(const g of ['female','male']){
      let n=0;
      const isEloq=v=>!!VOICE_ELOQ[baseOf(v)];
      pool.filter(v=>!isEloq(v) && voiceGenderOf(v)===g).forEach(v=>{ const b=baseOf(v); if(n<2 && !used.has(b)){ used.add(b); VOICE_GENDER[v.name]=g; out.push(v); n++; } });
      pool.filter(v=>isEloq(v) && VOICE_ELOQ[baseOf(v)]===g).forEach(v=>{ const b=baseOf(v); if(n<2 && !used.has(b)){ used.add(b); VOICE_GENDER[v.name]=g; out.push(v); n++; } });
    }
    // Si faltan (nombres desconocidos), completar con las mejores voces restantes del idioma
    let have=out.filter(v=>deaccent(v.lang).startsWith(lang)).length;
    pool.filter(v=>!VOICE_ELOQ[baseOf(v)]).forEach(v=>{ const b=baseOf(v); if(have<4 && !used.has(b)){ used.add(b); out.push(v); have++; } });
  }
  // Último recurso: si el sistema no tiene voces en español/inglés, mostrar lo que haya
  if(!out.length) return (all||[]).filter(v=>!VOICE_NOVELTY.test(deaccent(v.name))).slice(0,8);
  return out;
}

// ═══ TTS COMPONENT ═══
function TTSBar({ text, onProgress }) {
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const [speed, setSpeed] = useState(1);
  const [allVoices, setAllVoices] = useState([]);
  const [selectedVoiceName, setSelectedVoiceName] = useState(() => LS.get('sq_tts_voicename',''));
  const [showVoiceMenu, setShowVoiceMenu] = useState(false);
  const uttRef = useRef(null);
  const intervalRef = useRef(null);

  useEffect(() => {
    function load() {
      const v = window.speechSynthesis?.getVoices() || [];
      if(v.length > 0) {
        // Show ALL voices so user can see what's available, filter only Indo/etc
        const filtered = curateVoices(v);
        setAllVoices(filtered);
        if(!LS.get('sq_tts_voicename','') || !v.some(x=>x.name===LS.get('sq_tts_voicename',''))) {
          const def = filtered.find(x => x.lang.startsWith('es')) || filtered[0];
          if(def) { setSelectedVoiceName(def.name); LS.set('sq_tts_voicename', def.name); }
        }
      }
    }

    // iOS Safari: voices load async, need multiple attempts
    load();
    window.speechSynthesis?.addEventListener('voiceschanged', load);

    // Force iOS to load voices: speak empty utterance


    // Retry every 300ms for 3 seconds (iOS needs this)
    let attempts = 0;
    const retry = setInterval(() => {
      attempts++;
      load();
      if(attempts >= 10 || (window.speechSynthesis?.getVoices().length > 0)) {
        clearInterval(retry);
      }
    }, 300);

    const sync = () => setSelectedVoiceName(LS.get('sq_tts_voicename',''));
    window.addEventListener('tts-voice-changed', sync);

    return () => {
      window.speechSynthesis?.removeEventListener('voiceschanged', load);
      window.removeEventListener('tts-voice-changed', sync);
      clearInterval(retry);
    };
  }, []);

  const currentVoice = allVoices.find(v => v.name === selectedVoiceName) || (window.speechSynthesis?.getVoices()||[]).find(v => v.name === selectedVoiceName) || allVoices[0];

  // Divide el texto en frases cortas: iOS falla con textos largos en un solo bloque
  function chunkText(t){
    const clean=(t||'').replace(/\s+/g,' ').trim(); if(!clean) return [];
    const parts=clean.match(/[^.!?¡¿;:\n]+[.!?;:]*\s*/g)||[clean];
    const out=[]; let buf='';
    for(const raw of parts){
      let piece=raw;
      while(piece.length>220){ const cut=piece.lastIndexOf(' ',220)>60?piece.lastIndexOf(' ',220):220; if(buf){out.push(buf.trim());buf='';} out.push(piece.slice(0,cut).trim()); piece=piece.slice(cut); }
      if((buf+piece).length>220){ if(buf.trim()) out.push(buf.trim()); buf=piece; } else buf+=piece;
    }
    if(buf.trim()) out.push(buf.trim());
    return out;
  }
  const queueRef = useRef({chunks:[],i:0,run:0});
  const [ttsError,setTtsError]=useState('');

  function stopSpeech(){
    queueRef.current.run++;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    clearInterval(intervalRef.current);
    setPlaying(false); setProgress(0);
  }

  function speakChunk(run){
    const q=queueRef.current; const synth=window.speechSynthesis;
    if(run!==q.run) return;
    if(q.i>=q.chunks.length){ stopSpeech(); return; }
    const utt=new SpeechSynthesisUtterance(q.chunks[q.i]);
    const v=currentVoice || (window.speechSynthesis.getVoices()||[]).find(x=>x.lang&&x.lang.toLowerCase().startsWith('es'));
    if(v){ utt.voice=v; utt.lang=v.lang; } else utt.lang='es-ES';
    utt.rate=speed; utt.pitch=Math.min(2,Math.max(0.5,Number(LS.get('sq_tts_pitch',1))||1)); utt.volume=1;
    utt.onend=()=>{ if(run!==q.run) return; q.i++; setProgress(Math.round(q.i/q.chunks.length*100)); if(onProgress) onProgress(q.i/q.chunks.length); speakChunk(run); };
    utt.onerror=(e)=>{ if(run!==q.run) return; if(e&&(e.error==='interrupted'||e.error==='canceled')) return;
      setTtsError('No se pudo reproducir la voz ('+(e&&e.error||'error')+'). Prueba con otra voz.'); stopSpeech(); };
    uttRef.current=utt; // evita que el navegador lo libere antes de tiempo
    synth.speak(utt);
  }

  function speak() {
    const synth=window.speechSynthesis;
    if(!synth || typeof SpeechSynthesisUtterance==='undefined'){ setTtsError('Este navegador no tiene voz. Abre la app en Safari.'); return; }
    if(playing){ stopSpeech(); return; }
    setTtsError('');
    const chunks=chunkText(text);
    if(!chunks.length) return;
    try{ synth.cancel(); }catch(e){}
    const q=queueRef.current; q.run++; q.chunks=chunks; q.i=0;
    const run=q.run;
    setPlaying(true); setProgress(0);
    // Chrome de escritorio se pausa solo a los ~15 s; en iPhone pause/resume rompe la voz, así que solo fuera de iOS
    clearInterval(intervalRef.current);

    if(!isIOS) intervalRef.current=setInterval(()=>{ if(synth.speaking&&!synth.paused){ synth.pause(); synth.resume(); } },10000);
    // Debe llamarse dentro del toque del usuario (iOS lo exige): sin await ni setTimeout antes
    speakChunk(run);
    if(synth.paused) synth.resume();
  }

  function selectVoice(name) {
    setSelectedVoiceName(name);
    LS.set('sq_tts_voicename', name);
    setShowVoiceMenu(false);
    if(playing) stopSpeech();
  }

  useEffect(() => () => { queueRef.current.run++; try{window.speechSynthesis?.cancel();}catch(e){} clearInterval(intervalRef.current); }, []);

  useEffect(() => { if(playing) stopSpeech(); }, [text]);

  // Get accent flag for a voice
  function voiceFlag(v) {
    if(!v) return '🔊';
    if(v.lang.startsWith('es-ES')||v.lang==='es_ES') return '🇪🇸';
    if(v.lang.startsWith('es-MX')||v.lang==='es_MX') return '🇲🇽';
    if(v.lang.startsWith('es-AR')) return '🇦🇷';
    if(v.lang.startsWith('es-CO')) return '🇨🇴';
    if(v.lang.startsWith('es-US')) return '🌎';
    if(v.lang.startsWith('es')) return '🌍';
    if(v.lang.startsWith('en-GB')||v.lang==='en_GB') return '🇬🇧';
    if(v.lang.startsWith('en-AU')) return '🇦🇺';
    if(v.lang.startsWith('en-US')||v.lang==='en_US') return '🇺🇸';
    if(v.lang.startsWith('en')) return '🌐';
    return '🔊';
  }

  const esVoices = allVoices.filter(v => v.lang.startsWith('es'));
  const enVoices = allVoices.filter(v => v.lang.startsWith('en'));

  return (

// ═══ PIXEL CITY ═══
function PixelCity({ buildings, country, fireworks = false }) {
  const wrapRef = useRef(null), canvasRef = useRef(null);
  const items = buildings.map(b => (typeof b === 'string' ? { id: b, lvl: 2 } : { id: b.id, lvl: b.lvl || 2 }));
  const key = items.map(i => i.id + ':' + i.lvl).join(',') + (fireworks ? '!' : '');
  useEffect(() => {
    const canvas = canvasRef.current, wrap = wrapRef.current; if (!canvas || !wrap) return;
    const ctx = canvas.getContext('2d');
    let raf = 0, W = 0, H = 0, last = 0, alive = true;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const size = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      W = Math.max(260, Math.round(wrap.clientWidth || 320)); H = Math.round(Math.min(W * 0.62, 460));
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    const draw = (sec) => { ctx.clearRect(0, 0, W, H); CityArt.scene(ctx, W, H, items, country, sec, { fireworks }); };
    const frame = (ms) => { if (!alive) return; if (ms - last > 45) { last = ms; draw(ms / 1000); } raf = requestAnimationFrame(frame); };
    size(); draw(0);
    if (!reduce) raf = requestAnimationFrame(frame);
    const ro = window.ResizeObserver ? new ResizeObserver(() => { size(); draw(last / 1000); }) : null;
    if (ro) ro.observe(wrap);
    return () => { alive = false; cancelAnimationFrame(raf); if (ro) ro.disconnect(); };
  }, [key, country && country.id]);
  return <div ref={wrapRef} style={{ width: '100%', lineHeight: 0 }}><canvas ref={canvasRef} id="pixel-city"/></div>;
}

function BuildingArt({ id, country, size = 52, dim = false, lvl = 2 }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(size * dpr); cv.height = Math.round(size * dpr);
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    CityArt.thumb(c, size, id, country, 2, lvl || 2);
  }, [id, size, lvl, country && country.id]);
  return <canvas ref={ref} role="img" aria-label={WORLD_BUILDINGS[id]?.label || id}
    style={{ width: size, height: size, display: 'block', borderRadius: size * 0.18, filter: dim ? 'grayscale(1) brightness(0.55)' : 'none', flexShrink: 0 }}/>;
}

const LEVEL_NAMES = ['Sin construir', 'En construcción', 'Terminado', 'De lujo'];

function LevelDots({ lvl, color }) {
  return <div style={{ display: 'flex', gap: 4 }}>{[1, 2, 3].map(i => (
    <span key={i} style={{ width: 9, height: 9, borderRadius: 5, background: i <= lvl ? color : 'transparent', border: `1.5px solid ${i <= lvl ? color : '#475569'}` }}/>
  ))}</div>;
}

// ═══ MUNDO — continentes, países, edificios con 3 niveles ═══
function ConquestScreen({ tokens, city, conquests, milestones, onUpgrade }) {
  const firstOpen = (cont) => WORLD_COUNTRIES.find(c => c.continent === cont && !conquests.includes(c.id)) || WORLD_COUNTRIES.find(c => c.continent === cont);
  const unlockedConts = CONTINENTS.filter(ct => continentUnlocked(ct, conquests));
  const defaultCont = [...unlockedConts].reverse().find(ct => WORLD_COUNTRIES.some(c => c.continent === ct.id && !conquests.includes(c.id))) || unlockedConts[0];
  const [contId, setContId] = useState(() => LS.get('sq_ui_cont', defaultCont.id));
  const [countryId, setCountryId] = useState(() => LS.get('sq_ui_country', null));
  const cont = CONTINENTS.find(c => c.id === contId) || defaultCont;
  const contOpen = continentUnlocked(cont, conquests);
  const countries = WORLD_COUNTRIES.filter(c => c.continent === cont.id);
  const country = countries.find(c => c.id === countryId) || firstOpen(cont.id);
  useEffect(() => { LS.set('sq_ui_cont', cont.id); }, [cont.id]);
  useEffect(() => { if (country) LS.set('sq_ui_country', country.id); }, [country && country.id]);

  const levels = city[country.id] || {};
  const pct = countryPct(city, country);
  const conquered = conquests.includes(country.id);
  const done = milestones[country.id] || [];
  const nextMs = MILESTONES.find(m => !done.includes(m.pct));
  const scene = country.buildings.filter(b => levels[b] > 0).map(b => ({ id: b, lvl: levels[b] }));
  const contConq = (ct) => WORLD_COUNTRIES.filter(c => c.continent === ct.id && conquests.includes(c.id)).length;
  const contTotal = (ct) => WORLD_COUNTRIES.filter(c => c.continent === ct.id).length;

  return (
    <div className="scroll-area fade-up">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 }}>
        <div>
          <div className="font-display" style={{ fontSize: 27, fontWeight: 800, color: 'var(--text)', marginBottom: 4 }}>🌍 Mundo</div>
          <div style={{ fontSize: 17, color: 'var(--muted)' }}>{conquests.length}/{WORLD_COUNTRIES.length} países conquistados</div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div className="font-display grad-gold" style={{ fontSize: 26, fontWeight: 800, lineHeight: 1 }}>{tokens}</div>
          <div style={{ fontSize: 17, color: 'var(--muted)' }}>StudyTokens</div>
        </div>
      </div>

      {/* Continentes */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 6, marginBottom: 12 }}>
        {CONTINENTS.map(ct => {
          const open = continentUnlocked(ct, conquests), active = ct.id === cont.id;
          return (
            <button key={ct.id} onClick={() => { setContId(ct.id); setCountryId(null); }}
              style={{ padding: '8px 4px', borderRadius: 14, border: `2px solid ${active ? '#06b6d4' : 'transparent'}`, background: active ? 'rgba(6,182,212,0.12)' : 'var(--surface2)', cursor: 'pointer', opacity: open ? 1 : 0.55 }}>
              <div style={{ fontSize: 20 }}>{open ? ct.emoji : '🔒'}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: active ? '#67e8f9' : 'var(--text)', fontFamily: 'Plus Jakarta Sans' }}>{ct.name}</div>
              <div style={{ fontSize: 11, color: 'var(--muted)' }}>{contConq(ct)}/{contTotal(ct)}</div>
            </button>
          );
        })}
      </div>

      {!contOpen ? (
        <div className="glass-card" style={{ padding: 24, textAlign: 'center' }}>
          <div style={{ fontSize: 44, marginBottom: 8 }}>🔒</div>
          <div className="font-display" style={{ fontWeight: 800, fontSize: 20, color: 'var(--text)', marginBottom: 6 }}>{cont.name} está bloqueado</div>
          <div style={{ fontSize: 16, color: 'var(--muted)', lineHeight: 1.6 }}>
            Conquista {cont.unlock.conquests} países de {CONTINENTS.find(c => c.id === cont.unlock.from).name} para desbloquearlo.<br/>
            Llevas {contConq(CONTINENTS.find(c => c.id === cont.unlock.from))}.
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, justifyContent: 'center', marginTop: 16 }}>
            {countries.map(c => <span key={c.id} style={{ fontSize: 26, filter: 'grayscale(0.6)' }} title={c.name}>{c.flag}</span>)}
          </div>
        </div>
      ) : (
        <>
          {/* Países del continente */}
          <div style={{ display: 'flex', gap: 8, overflowX: 'auto', marginBottom: 14, paddingBottom: 4 }}>
            {countries.map(c => {
              const p = countryPct(city, c), isC = conquests.includes(c.id), act = c.id === country.id;
              return (
                <button key={c.id} onClick={() => setCountryId(c.id)}
                  style={{ flexShrink: 0, padding: '7px 12px', borderRadius: 20, border: `2px solid ${act ? c.color : 'transparent'}`, background: isC ? `${c.color}22` : act ? `${c.color}11` : 'var(--surface2)', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap' }}>
                  <span style={{ fontSize: 17 }}>{c.flag}</span>
                  <span style={{ fontSize: 15, fontWeight: 700, color: act || isC ? c.color : '#94a3b8', fontFamily: 'Plus Jakarta Sans' }}>{c.name}</span>
                  <span style={{ fontSize: 12, color: 'var(--muted)' }}>{isC ? '🏆' : p + '%'}</span>
                </button>
              );
            })}
          </div>

          {/* Cabecera del país con % de edificación */}
          <div style={{ background: `linear-gradient(135deg,${country.color}22,${country.color}08)`, border: `1px solid ${country.color}44`, borderRadius: 20, padding: 16, marginBottom: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
              <div>
                <div className="font-display" style={{ fontWeight: 800, fontSize: 21, color: 'var(--text)' }}>{country.flag} {country.name}</div>
                <div style={{ fontSize: 15, color: 'var(--muted)' }}>{country.description}</div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div className="font-display" style={{ fontSize: 28, fontWeight: 800, color: country.color, lineHeight: 1 }}>{pct}%</div>
                <div style={{ fontSize: 13, color: 'var(--muted)' }}>edificado</div>
              </div>
            </div>
            <div style={{ position: 'relative', height: 10, background: 'rgba(51,65,85,0.5)', borderRadius: 6, marginBottom: 6 }}>
              <div style={{ position: 'absolute', inset: 0, width: `${pct}%`, background: `linear-gradient(90deg,${country.color},${country.color}bb)`, borderRadius: 6, transition: 'width .6s', boxShadow: `0 0 10px ${country.color}66` }}/>
              {MILESTONES.map(m => (
                <div key={m.pct} style={{ position: 'absolute', left: `calc(${m.pct}% - 9px)`, top: -6, width: 18, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13 }}>
                  {m.pct === 100 ? '🏆' : done.includes(m.pct) ? '✅' : '🎁'}
                </div>
              ))}
            </div>
            <div style={{ fontSize: 14, color: 'var(--muted)', marginTop: 10 }}>
              {conquered ? (pct < 100 ? '🏆 Conquistado · mejora a "lujo" para completar el 100 %' : '🏆 ¡Conquistado al 100 %!') :
                nextMs ? `Próximo bono: +${nextMs.bonus} 🪙 al ${nextMs.pct}%` : ''}
            </div>
          </div>

          {/* Escena */}
          <div style={{ marginBottom: 14, borderRadius: 16, overflow: 'hidden', border: `1px solid ${country.color}33`, boxShadow: `0 0 20px ${country.color}15` }}>
            {scene.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '36px 20px', background: 'var(--surface2)' }}>
                <div style={{ fontSize: 36, marginBottom: 8 }}>{country.flag}</div>
                <div className="font-display" style={{ fontWeight: 800, fontSize: 18, color: 'var(--text)', marginBottom: 4 }}>Terreno libre</div>
                <div style={{ fontSize: 15, color: 'var(--muted)' }}>Construye tu primer edificio en {country.name}</div>

            ) : <PixelCity buildings={scene} country={country} fireworks={conquered && pct >= 100}/>}
          </div>

          {/* Edificios con niveles */}
          <div className="glass-card" style={{ padding: 14, marginBottom: 14 }}>
            <div className="font-display" style={{ fontWeight: 800, fontSize: 18, color: 'var(--text)', marginBottom: 4 }}>Edificios</div>
            <div style={{ fontSize: 13, color: 'var(--muted)', marginBottom: 10 }}>Cada edificio tiene 3 niveles: en construcción, terminado y de lujo.</div>
            {country.buildings.map(bid => {
              const def = WORLD_BUILDINGS[bid], lvl = levels[bid] || 0, max = lvl >= MAX_LVL;
              const cost = max ? 0 : levelCost(bid, lvl + 1), can = tokens >= cost;
              return (
                <div key={bid} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 0', borderBottom: '1px solid rgba(51,65,85,0.3)' }}>
                  <BuildingArt id={bid} country={country} size={58} lvl={Math.max(1, lvl)} dim={lvl === 0}/>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="font-display" style={{ fontWeight: 700, fontSize: 16, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{def.label}</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 4 }}>

                    </div>
                  </div>
                  {max ? <span style={{ fontSize: 13, color: '#fcd34d', fontWeight: 700 }}>★ Máx.</span> : (
                    <button className={`btn btn-sm ${can ? 'btn-gold' : 'btn-secondary'}`} disabled={!can} onClick={() => onUpgrade(country, bid)}

          {/* Resumen del continente */}
          <div className="glass-card" style={{ padding: 16 }}>
            <div className="font-display" style={{ fontWeight: 800, fontSize: 18, color: 'var(--text)', marginBottom: 10 }}>{cont.emoji} {cont.name}</div>
            {countries.map(c => {
              const p = countryPct(city, c), isC = conquests.includes(c.id);

                <div key={c.id} onClick={() => setCountryId(c.id)} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '8px 0', cursor: 'pointer' }}>

            })}
          </div>
        </>

        </div>
      </div>
    </div>
  );
}
