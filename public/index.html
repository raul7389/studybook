// ═══ REPASO ESPACIADO ═══
function ReviewScreen({ deck, onAnswer, onNav }) {
  const now = Date.now();
  const due = (deck || []).filter(c => c.due <= now).sort((a, b) => a.due - b.due);
  const [flipped, setFlipped] = useState(false);
  const card = due[0];
  const upcoming = (deck || []).filter(c => c.due > now).sort((a, b) => a.due - b.due);
  const days = (ms) => Math.max(1, Math.round((ms - now) / 864e5));
  useEffect(() => { setFlipped(false); }, [card && card.id]);

  return (
    <div className="scroll-area fade-up">
      <div style={{ marginBottom: 16 }}>
        <div className="font-display" style={{ fontSize: 27, fontWeight: 800, color: 'var(--text)', marginBottom: 4 }}>🧠 Repaso</div>
        <div style={{ fontSize: 16, color: 'var(--muted)' }}>Las tarjetas vuelven a los 1, 3, 7, 14 y 30 días. A tiempo pagan doble.</div>
      </div>
      {card ? (
        <>
          <div style={{ fontSize: 14, color: 'var(--muted)', marginBottom: 8 }}>{due.length} pendiente{due.length > 1 ? 's' : ''} · {card.chapter}</div>
          <div className="glass-card" onClick={() => setFlipped(f => !f)} style={{ padding: 24, minHeight: 220, cursor: 'pointer', display: 'flex', flexDirection: 'column', justifyContent: 'center', border: '1px solid rgba(139,92,246,0.35)' }}>
            <div style={{ fontSize: 12, color: '#a78bfa', fontWeight: 700, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 10 }}>{flipped ? 'Respuesta' : 'Pregunta'} · caja {card.box + 1}/5</div>
            <div className="font-display" style={{ fontSize: 19, fontWeight: 700, color: 'var(--text)', lineHeight: 1.5 }}>{flipped ? card.a : card.q}</div>
            {!flipped && <div style={{ fontSize: 13, color: 'var(--muted)', marginTop: 16 }}>Toca para ver la respuesta</div>}
          </div>
          {flipped && (
            <div style={{ display: 'flex', gap: 10, marginTop: 14 }}>
              <button className="btn btn-danger" style={{ flex: 1 }} onClick={() => onAnswer(card.id, false)}>✗ No lo sabía</button>
              <button className="btn btn-success" style={{ flex: 1 }} onClick={() => onAnswer(card.id, true)}>✓ Lo sabía</button>
            </div>
          )}
        </>
      ) : (
        <div className="glass-card" style={{ padding: 28, textAlign: 'center' }}>
          <div style={{ fontSize: 44, marginBottom: 8 }}>✨</div>
          <div className="font-display" style={{ fontWeight: 800, fontSize: 19, color: 'var(--text)', marginBottom: 6 }}>{(deck || []).length ? '¡Todo repasado por hoy!' : 'Aún no tienes tarjetas'}</div>
          <div style={{ fontSize: 15, color: 'var(--muted)', lineHeight: 1.6, marginBottom: 14 }}>
            {(deck || []).length ? `La próxima vuelve en ${days(upcoming[0].due)} día(s).` : 'Genera flashcards en cualquier capítulo y se guardan aquí para repasarlas.'}
          </div>
          <button className="btn btn-primary" onClick={() => onNav('library')}>Ir a mis libros</button>
        </div>
      )}
      {upcoming.length > 0 && (
        <div className="glass-card" style={{ padding: 16, marginTop: 14 }}>
          <div className="font-display" style={{ fontWeight: 800, fontSize: 16, color: 'var(--text)', marginBottom: 8 }}>Próximos repasos</div>
          {[1, 3, 7, 14, 30].map(d => {
            const n = upcoming.filter(c => days(c.due) <= d && (d === 1 || days(c.due) > [0, 1, 3, 7, 14][[1, 3, 7, 14, 30].indexOf(d)])).length;
            return n ? <div key={d} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14, color: 'var(--muted)', padding: '4px 0' }}><span>{d === 1 ? 'Mañana' : `En ≤ ${d} días`}</span><span>{n}</span></div> : null;
          })}
        </div>
      )}
    </div>
  );
}

// ═══ SINCRONIZACIÓN teléfono ↔ PC (Netlify Blobs, protegido con PIN) ═══
const SYNC_KEYS = ['sq_tts_pitch','sq_readlog','sq_tokens','sq_city3','sq_conquests','sq_progress2','sq_feynman_notes','sq_milestones','sq_streak','sq_readmin','sq_deck','sq_week','sq_booksdone','sq_activebook','sq_theme','sq_tts_voicename','sq_stats'];
const Sync = {
  enabled(){ return !!LS.get('sq_pin','') && !!(window.__server && window.__server.serverKey); },
  snapshot(){ const o={}; SYNC_KEYS.forEach(k=>{ const v=LS.get(k,undefined); if(v!==undefined) o[k]=v; }); return o; },
  hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return String(h); },
  async req(method,key,body){
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),8000);
    try{
      const r=await fetch('/api/sync?key='+key,{method,signal:ctl.signal,headers:{'X-App-Pin':LS.get('sq_pin',''),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
      if(r.status===401) throw new Error('PIN incorrecto');
      if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error||('HTTP '+r.status)); }
      return r.json();
    } finally { clearTimeout(tm); }
  },
  score(d){ const lv=Object.values(d.sq_city3||{}).reduce((a,c)=>a+Object.values(c||{}).reduce((x,y)=>x+(y||0),0),0);
    return (d.sq_tokens||0)+lv*20+(d.sq_conquests||[]).length*200+Object.keys(d.sq_progress2||{}).length*10; },
  // Devuelve true si cambió algo local
  async pull(){
    let changed=false;
    const remote=await Sync.req('GET','state');
    if(remote && remote.data){
      const local=Sync.snapshot(), lastHash=LS.get('sq_sync_hash',null);
      let useRemote;
      if(lastHash===null){ // primer contacto de este dispositivo: gana el que tenga más progreso
        useRemote=Sync.score(remote.data)>=Sync.score(local);
        if(useRemote && Sync.score(local)>0) LS.set('sq_backup_'+Date.now(), local);
      } else useRemote=(remote.updatedAt||0)>(LS.get('sq_updatedAt',0)||0);
      if(useRemote){
        Object.entries(remote.data).forEach(([k,v])=>LS.set(k,v));
        LS.set('sq_updatedAt',remote.updatedAt||Date.now());
        LS.set('sq_sync_hash',Sync.hash(JSON.stringify(Sync.snapshot())));
        changed=true;
      }
    }
    try{
      const rb=await Sync.req('GET','books');
      if(rb && Array.isArray(rb.data)){
        const local=LS.get('sq_books',[])||[], ids=new Set(local.map(b=>b.id));
        const add=rb.data.filter(b=>!ids.has(b.id) && !(LS.get('sq_books_deleted',[])||[]).includes(b.id));
        if(add.length){ LS.set('sq_books',[...local,...add]); changed=true; }
      }
    }catch(e){}
    return changed;
  },
  async pushState(){
    const snap=Sync.snapshot(), h=Sync.hash(JSON.stringify(snap));
    if(h===LS.get('sq_sync_hash',null)) return;
    const updatedAt=Date.now(); LS.set('sq_updatedAt',updatedAt);
    await Sync.req('PUT','state',{updatedAt,data:snap});
    LS.set('sq_sync_hash',h);
  },
  async pushBooks(books){
    const s=JSON.stringify(books), h=Sync.hash(s);
    if(h===LS.get('sq_books_hash',null)) return;
    if(s.length>4.4e6) throw new Error('Libros demasiado grandes para sincronizar');
    await Sync.req('PUT','books',{updatedAt:Date.now(),data:books});
    LS.set('sq_books_hash',h);
  },
};

// ═══ RETOS, FECHAS ═══
const pad2=n=>String(n).padStart(2,'0');
function todayStr(d=new Date()){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function weekStr(d=new Date()){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return t.getUTCFullYear()+'-W'+Math.ceil(((t-y0)/864e5+1)/7); }
const WEEKLY=[
  {id:'chapters',label:'Lee 3 capítulos',goal:3,reward:40,icon:'📖'},
  {id:'feynman',label:'Aprueba 1 explicación Feynman',goal:1,reward:40,icon:'🧠'},
  {id:'reviews',label:'Repasa 10 tarjetas',goal:10,reward:40,icon:'🃏'},
  {id:'minutes',label:'Lee 60 minutos',goal:60,reward:40,icon:'⏱️'},
];
const WEEKLY_CHEST=100;
const REVIEW_DAYS=[1,3,7,14,30];

function loadCity(){
  const c3=LS.get('sq_city3',null); if(c3) return c3;
  const c2=LS.get('sq_city2',{})||{}, out={};
  Object.entries(c2).forEach(([cid,arr])=>{ out[cid]={}; (arr||[]).forEach(b=>{ out[cid][b]=2; }); }); // antiguos edificios = terminados
  return out;
}
function loadMilestones(){
  const m=LS.get('sq_milestones',null); if(m) return m;
  const out={}; (LS.get('sq_conquests',[])||[]).forEach(cid=>{ out[cid]=[50,75,100]; }); // ya cobrados
  return out;
}

// ═══ APP ROOT ═══
function App(){
  const server=window.__server||{serverKey:false,pin:false};
  const [apiKey,setApiKey]=useState(()=>LS.get('sq_apikey',''));
  const [pin,setPin]=useState(()=>LS.get('sq_pin',''));
  const [tokens,setTokens]=useState(()=>LS.get('sq_tokens',0));
  const [city,setCity]=useState(loadCity);
  const [milestones,setMilestones]=useState(loadMilestones);
  const [books,setBooks]=useState(()=>LS.get('sq_books',[]));
  const [activeBookId,setActiveBookId]=useState(()=>LS.get('sq_activebook',null));
  const [progress,setProgress]=useState(()=>LS.get('sq_progress2',{}));
  const [conquests,setConquests]=useState(()=>LS.get('sq_conquests',[]));
  const [feynmanNotes,setFeynmanNotes]=useState(()=>LS.get('sq_feynman_notes',[]));
  const [streak,setStreak]=useState(()=>LS.get('sq_streak',{last:'',count:0,best:0}));
  const [readmin,setReadmin]=useState(()=>LS.get('sq_readmin',{date:'',minutes:0}));
  const [deck,setDeck]=useState(()=>LS.get('sq_deck',[]));
  const [week,setWeek]=useState(()=>LS.get('sq_week',{week:'',counts:{},claimed:[],chest:false}));
  const [booksDone,setBooksDone]=useState(()=>LS.get('sq_booksdone',[]));
  const [stats,setStats]=useState(()=>LS.get('sq_stats',{minutes:0,reviews:0,voice:0}));
  const [theme,setTheme]=useState(()=>LS.get('sq_theme','dark'));
  const [activeNav,setActiveNav]=useState('home');
  const [selectedChapter,setSelectedChapter]=useState(null);
  const [selectedBook,setSelectedBook]=useState(null);
  const [toast,setToast]=useState(null);
  const [celebrate,setCelebrate]=useState(null);
  const [onboardKey,setOnboardKey]=useState('');
  const [pinInput,setPinInput]=useState('');
  const [pinErr,setPinErr]=useState('');
  const [pinBusy,setPinBusy]=useState(false);
  const [pinSkip,setPinSkip]=useState(()=>!!sessionStorage.getItem('sq_pin_skip'));
  const [syncState,setSyncState]=useState(()=>window.__syncError?{ok:false,msg:window.__syncError}:{ok:true,msg:''});

  useEffect(()=>{ LS.set('sq_apikey',apiKey); },[apiKey]);
  useEffect(()=>{ LS.set('sq_tokens',tokens); },[tokens]);
  useEffect(()=>{ LS.set('sq_city3',city); },[city]);
  useEffect(()=>{ LS.set('sq_milestones',milestones); },[milestones]);
  useEffect(()=>{ LS.set('sq_books',books); },[books]);
  useEffect(()=>{ LS.set('sq_activebook',activeBookId); },[activeBookId]);
  useEffect(()=>{ LS.set('sq_progress2',progress); },[progress]);
  useEffect(()=>{ LS.set('sq_conquests',conquests); },[conquests]);
  useEffect(()=>{ LS.set('sq_feynman_notes',feynmanNotes); },[feynmanNotes]);
  useEffect(()=>{ LS.set('sq_streak',streak); },[streak]);
  useEffect(()=>{ LS.set('sq_readmin',readmin); },[readmin]);
  useEffect(()=>{ LS.set('sq_deck',deck); },[deck]);
  useEffect(()=>{ LS.set('sq_week',week); },[week]);
  useEffect(()=>{ LS.set('sq_booksdone',booksDone); },[booksDone]);
  useEffect(()=>{ LS.set('sq_stats',stats); },[stats]);
  useEffect(()=>{ LS.set('sq_theme',theme); document.documentElement.setAttribute('data-theme',theme); },[theme]);

  // Subir cambios (con retraso para agrupar)
  useEffect(()=>{
    if(!Sync.enabled()) return;
    const t=setTimeout(()=>{ Sync.pushState().then(()=>setSyncState({ok:true,msg:'',at:Date.now()})).catch(e=>setSyncState({ok:false,msg:e.message})); },2500);
    return ()=>clearTimeout(t);
  },[tokens,city,milestones,activeBookId,progress,conquests,feynmanNotes,streak,readmin,deck,week,booksDone,stats,theme,pin]);
  useEffect(()=>{
    if(!Sync.enabled()) return;
    const t=setTimeout(()=>{ Sync.pushBooks(books).catch(e=>setSyncState({ok:false,msg:e.message})); },4000);
    return ()=>clearTimeout(t);
  },[books,pin]);
  // Al volver a la app, traer lo hecho en el otro dispositivo
  useEffect(()=>{
    let hiddenAt=0;
    const onVis=()=>{
      if(document.visibilityState==='hidden'){ hiddenAt=Date.now(); return; }
      if(!Sync.enabled() || Date.now()-hiddenAt<20000) return;
      Sync.pull().then(ch=>{ if(ch) location.reload(); }).catch(()=>{});
    };
    document.addEventListener('visibilitychange',onVis);
    return ()=>document.removeEventListener('visibilitychange',onVis);
  },[]);

  const aiReady=!!apiKey || (server.serverKey && (!server.pin || !!pin));
  const showToast=(msg,type='success')=>setToast({msg,type,key:Date.now()});
  const earnTokens=(amount,reason)=>{ if(!amount) return; setTokens(t=>t+amount); showToast(`+${amount} 🪙 ${reason}`); };
  const saveApiKey=(k)=>{ setApiKey(k.trim()); showToast(k.trim()?'API Key guardada ✅':'API Key borrada'); };

  async function submitPin(p){
    const v=(p||'').trim(); if(!v) return;
    setPinBusy(true); setPinErr('');
    const prev=LS.get('sq_pin','');
    LS.set('sq_pin',v);
    try{
      await Sync.req('GET','ping');
      const changed=await Sync.pull();
      setPin(v);
      if(changed){ location.reload(); return; }
      showToast('🔗 Dispositivo conectado');
    }catch(e){
      LS.set('sq_pin',prev);
      setPinErr(e.message==='PIN incorrecto'?'PIN incorrecto':'No se pudo conectar: '+e.message);
    }finally{ setPinBusy(false); }
  }
  function forgetPin(){ LS.set('sq_pin',''); LS.set('sq_sync_hash',null); setPin(''); showToast('Dispositivo desconectado'); }

  // ── Racha diaria + contadores semanales ──
  function bumpWeek(id,n=1){
    setWeek(w=>{ const cur=w.week===weekStr()?w:{week:weekStr(),counts:{},claimed:[],chest:false}; return {...cur,counts:{...cur.counts,[id]:(cur.counts[id]||0)+n}}; });
  }
  function bumpStreak(){
    const t=todayStr(); if(streak.last===t) return;
    const y=todayStr(new Date(Date.now()-864e5));
    const count=streak.last===y?streak.count+1:1;
    setStreak({last:t,count,best:Math.max(streak.best||0,count)});
    const bonus=Math.min(TOKENS.STREAK_STEP*count,TOKENS.STREAK_MAX);
    setTimeout(()=>earnTokens(bonus,`🔥 Racha de ${count} día${count>1?'s':''}`),600);
  }
  function onStudy(type,data={}){
    bumpStreak();
    if(type==='chapter') bumpWeek('chapters');
    if(type==='feynman' && data.passed) bumpWeek('feynman');
    if(type==='review') bumpWeek('reviews');
    if(type==='minute'){
      bumpWeek('minutes'); setStats(s=>({...s,minutes:(s.minutes||0)+1}));
      const t=todayStr(), cur=readmin.date===t?readmin.minutes:0;
      if(cur<TOKENS.READ_MINUTE_CAP){
        setReadmin({date:t,minutes:cur+1}); setTokens(x=>x+TOKENS.READ_MINUTE);
        if((cur+1)%5===0) showToast(`⏱️ ${cur+1} min leyendo hoy · +5 🪙`);
      }
    }
    if(type==='voice') setStats(s=>({...s,voice:(s.voice||0)+1}));
  }
  function claimChallenge(id){
    const w=WEEKLY.find(x=>x.id===id); if(!w) return;
    const cur=week.week===weekStr()?week:{week:weekStr(),counts:{},claimed:[],chest:false};
    if((cur.claimed||[]).includes(id) || ((cur.counts||{})[id]||0)<w.goal) return;
    setWeek({...cur,claimed:[...(cur.claimed||[]),id]}); earnTokens(w.reward,`🎯 Reto: ${w.label}`);
  }
  function claimChest(){
    const cur=week.week===weekStr()?week:null; if(!cur || cur.chest) return;
    if(!WEEKLY.every(w=>(cur.claimed||[]).includes(w.id))) return;
    setWeek({...cur,chest:true}); earnTokens(WEEKLY_CHEST,'🎁 ¡Cofre semanal!');
  }

  // ── Repaso espaciado ──
  function addCards(cards,chapter,book){
    setDeck(d=>{
      const have=new Set(d.map(c=>c.q.trim().toLowerCase()));
      const add=(cards||[]).filter(c=>c&&c.q&&c.a&&!have.has(String(c.q).trim().toLowerCase())).map((c,i)=>({id:Date.now()+'_'+i,q:String(c.q),a:String(c.a),chapter:chapter?.title||'',bookId:book?.id||'',box:0,due:Date.now()+864e5}));
      if(add.length) setTimeout(()=>showToast(`🧠 ${add.length} tarjetas guardadas para repaso`),300);
      return [...d,...add];
    });
  }
  function answerReview(id,knew){
    const card=deck.find(c=>c.id===id); if(!card) return;
    const now=Date.now();
    let upd;
    if(knew){ const box=Math.min(card.box+1,REVIEW_DAYS.length-1); upd={...card,box,due:now+REVIEW_DAYS[box]*864e5};
      const onTime=now-card.due<=1.5*864e5; earnTokens(onTime?TOKENS.REVIEW_ONTIME:TOKENS.FLASHCARD,onTime?'🧠 Repaso a tiempo (doble)':'🧠 Repaso'); }
    else upd={...card,box:0,due:now+864e5};
    setDeck(d=>d.map(c=>c.id===id?upd:c));
    setStats(s=>({...s,reviews:(s.reviews||0)+1}));
    onStudy('review');
  }

  // ── Libros ──
  function loadBook(newBook){
    setBooks(prev=>{const exists=prev.find(b=>b.title===newBook.title);if(exists)return prev;return [...prev,newBook];});
    setActiveBookId(newBook.id); setActiveNav('library');
    showToast(`📚 ${newBook.chapters.length} capítulos cargados`);
  }
  function deleteBook(id){
    setBooks(prev=>prev.filter(b=>b.id!==id));
    LS.set('sq_books_deleted',[...(LS.get('sq_books_deleted',[])||[]),id]);
    if(activeBookId===id){ const remaining=books.filter(b=>b.id!==id); setActiveBookId(remaining[0]?.id||null); }
  }
  function completeChapter(chapterId){
    const book=selectedBook||books.find(b=>b.id===activeBookId);
    const key=`${book?.id||activeBookId}_${chapterId}`;
    const np={...progress,[key]:progress[key]||Date.now()};
    setProgress(np);
    if(book && !booksDone.includes(book.id) && (book.chapters||[]).length>0 && book.chapters.every(ch=>np[`${book.id}_${ch.id}`])){
      setBooksDone(b=>[...b,book.id]); setTimeout(()=>earnTokens(TOKENS.BOOK_DONE,`📚 ¡Libro terminado: ${book.title}!`),900);
    }
  }
  function selectChapter(ch,book){ setSelectedChapter(ch); setSelectedBook(book); setActiveNav('reader'); }

  // ── Mundo: construir y mejorar ──
  function upgradeBuilding(country,bid){
    const cur=(city[country.id]||{})[bid]||0; if(cur>=MAX_LVL) return;
    const cost=levelCost(bid,cur+1); if(tokens<cost){ showToast(`Te faltan ${cost-tokens} tokens`,'error'); return; }
    const newCity={...city,[country.id]:{...(city[country.id]||{}),[bid]:cur+1}};
    setCity(newCity); setTokens(t=>t-cost);
    const pct=countryPct(newCity,country), done=milestones[country.id]||[];
    const hits=MILESTONES.filter(m=>pct>=m.pct&&!done.includes(m.pct));
    const name=WORLD_BUILDINGS[bid].label;
    if(hits.length){
      setMilestones(ms=>({...ms,[country.id]:[...done,...hits.map(h=>h.pct)]}));
      const bonus=hits.reduce((a,h)=>a+h.bonus,0);
      setTimeout(()=>{
        setTokens(t=>t+bonus);
        if(hits.some(h=>h.pct===100)){ setConquests(c=>c.includes(country.id)?c:[...c,country.id]); setCelebrate({country,bonus}); }
        else showToast(`🎁 ${hits[hits.length-1].label} ${country.flag} ${country.name} +${bonus} 🪙`,'conquest');
      },500);
    } else showToast(cur===0?`🏗️ ${name}: en construcción`:cur===1?`✅ ${name}: terminado`:`✨ ${name}: ¡de lujo!`);
  }

  const navItems=[
    {id:'home',label:'Inicio',Icon:Icons.Home},
    {id:'library',label:'Libros',Icon:Icons.Book},
    {id:'city',label:'Mundo',Icon:Icons.Globe},
    {id:'stats',label:'Stats',Icon:Icons.Chart},
    {id:'settings',label:'Config',Icon:Icons.Settings},
  ];
  const showReader=activeNav==='reader'&&selectedChapter;
  const chapterProgressKey=`${selectedBook?.id||activeBookId}_${selectedChapter?.id}`;
  const needPin=server.serverKey && server.pin && !pin && !pinSkip;
  const needKey=!server.serverKey && !apiKey;

  return(
    <div className="app-shell" style={{display:'flex',flexDirection:'column',height:'100%',position:'relative'}}>
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {showReader?(
          <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{padding:'12px 16px',background:'var(--surface2)',borderBottom:'1px solid rgba(51,65,85,0.4)',backdropFilter:'blur(16px)',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
              <button className="btn btn-secondary btn-sm" onClick={()=>{setActiveNav('library');setSelectedChapter(null);setSelectedBook(null);}}>← Volver</button>
              <span style={{fontSize:16,color:'var(--muted)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontFamily:'Plus Jakarta Sans',fontWeight:600}}>{selectedBook?.title}</span>
              <span className="badge badge-gold">{tokens} ST</span>
            </div>
            <ReaderScreen chapter={selectedChapter} book={selectedBook} apiKey={apiKey} ai={aiReady} onEarnTokens={earnTokens} onComplete={completeChapter} alreadyDone={!!progress[chapterProgressKey]} onSaveFeynman={saveFeynmanNote} onStudy={onStudy} onAddCards={addCards}/>
          </div>
        ):(
          <>
            {activeNav==='home'&&<HomeScreen tokens={tokens} books={books} activeBookId={activeBookId} progress={progress} onNav={setActiveNav} conquests={conquests} city={city} streak={streak} week={week} deck={deck} readmin={readmin} onClaim={claimChallenge} onClaimChest={claimChest}/>}
            {activeNav==='library'&&<LibraryScreen books={books} activeBookId={activeBookId} onBookLoad={loadBook} onSelectBook={setActiveBookId} onDeleteBook={deleteBook} onChapterSelect={selectChapter} progress={progress}/>}
            {activeNav==='city'&&<ConquestScreen tokens={tokens} city={city} conquests={conquests} milestones={milestones} onUpgrade={upgradeBuilding}/>}
            {activeNav==='review'&&<ReviewScreen deck={deck} onAnswer={answerReview} onNav={setActiveNav}/>}
            {activeNav==='stats'&&<StatsScreen books={books} progress={progress} tokens={tokens} feynmanNotes={feynmanNotes} conquests={conquests} streak={streak} stats={stats} deck={deck} city={city}/>}
            {activeNav==='settings'&&<SettingsScreen apiKey={apiKey} onSave={saveApiKey} theme={theme} onToggleTheme={()=>setTheme(t=>t==='dark'?'light':'dark')} server={server} pin={pin} onPin={submitPin} onForgetPin={forgetPin} pinBusy={pinBusy} pinErr={pinErr} syncState={syncState}/>}
          </>
        )}
      </div>

      {!showReader&&(
        <nav className="bottom-nav">
          {navItems.map(item=>(
            <button key={item.id} className={`nav-item ${activeNav===item.id?'active':''}`} onClick={()=>setActiveNav(item.id)}>
              <item.Icon/>{item.label}
            </button>
          ))}
        </nav>
      )}

      {toast&&<Toast key={toast.key} message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      <ConquestCelebration data={celebrate} onClose={()=>setCelebrate(null)}/>

      {(needPin||needKey)&&activeNav==='home'&&(
        <div className="modal-overlay" style={{alignItems:'center'}}>
          <div style={{width:'calc(100% - 32px)',maxWidth:400,background:'linear-gradient(180deg,#0f172a,#07111f)',borderRadius:24,padding:28,border:'1px solid rgba(6,182,212,0.2)',boxShadow:'0 24px 80px rgba(0,0,0,0.8)'}}>
            <div style={{textAlign:'center',marginBottom:20}}>
              <div style={{fontSize:52,marginBottom:10}}>🎓</div>
              <div className="font-display" style={{fontWeight:800,fontSize:26,color:'#f1f5f9',marginBottom:6}}>StudyQuest</div>
              <div style={{fontSize:16,color:'#94a3b8',lineHeight:1.6}}>{needPin?'Escribe tu PIN para conectar este dispositivo. Tu progreso se sincroniza entre el teléfono y el PC.':'Ingresa tu API Key de Anthropic para comenzar.'}</div>
            </div>
            {needPin?(
              <>
                <input className="input" type="password" inputMode="numeric" autoComplete="off" placeholder="PIN" value={pinInput} onChange={e=>setPinInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submitPin(pinInput)} style={{marginBottom:10,textAlign:'center',letterSpacing:6,fontSize:22}}/>
                {pinErr&&<div style={{color:'#fca5a5',fontSize:14,marginBottom:10,textAlign:'center'}}>{pinErr}</div>}
                <button className="btn btn-primary btn-full btn-lg" disabled={pinBusy} onClick={()=>submitPin(pinInput)}>{pinBusy?<Spinner text="Conectando"/>:'Conectar →'}</button>
                <button className="btn btn-secondary btn-full" style={{marginTop:10}} onClick={()=>{sessionStorage.setItem('sq_pin_skip','1');setPinSkip(true);}}>Ahora no</button>
              </>
            ):(
              <>
                <input className="input" type="password" placeholder="sk-ant-..." onChange={e=>setOnboardKey(e.target.value)} value={onboardKey} style={{marginBottom:14}}/>
                <button className="btn btn-primary btn-full btn-lg" onClick={()=>{if(onboardKey.trim())saveApiKey(onboardKey);}}>Comenzar →</button>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );

  function saveFeynmanNote(note){ setFeynmanNotes(n=>[...n,note]); }
}

// ═══ ARRANQUE: comprobar servidor y traer progreso antes de pintar ═══
async function checkVersion(){
  try{
    const r=await fetch('/version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const {v}=await r.json();
    if(v && v!==APP_VERSION && sessionStorage.getItem('sq_reloaded_for')!==v){ sessionStorage.setItem('sq_reloaded_for',v); location.replace('/?v='+encodeURIComponent(v)); }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkVersion(); });
async function boot(){
  checkVersion();
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),3500);
    const r=await fetch('/api/claude',{method:'GET',signal:ctl.signal,cache:'no-store'}); clearTimeout(tm);
    if(r.ok){ const j=await r.json(); if(j&&typeof j==='object') window.__server=j; }
  }catch(e){}
  window.__server=window.__server||{serverKey:false,pin:false};
  if(Sync.enabled()){
    try{ await Promise.race([Sync.pull(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Sin conexión')),6000))]); }
    catch(e){ window.__syncError=e.message; }
  }
  if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
boot();

</script>
