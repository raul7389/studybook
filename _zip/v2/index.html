// ═══ STORAGE — triple-layer: localStorage + sessionStorage + cookie (iOS PWA safe) ═══
const LS = {
  get(k, d=null) {
    try { const v=localStorage.getItem(k); if(v!==null) return JSON.parse(v); } catch {}

      const m=document.cookie.match(new RegExp('(?:^|; )sq_c_'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'=([^;]*)'));

  set(k, v) {
    const s = JSON.stringify(v);
    try { localStorage.setItem(k, s); } catch {}

// ═══ TEXT PROCESSING ═══
function splitIntoChapters(text) {
  const patterns=[/\n\s*(Chapter\s+\d+[.:)—]?\s*[^\n]*)\n/gi,/\n\s*(CHAPTER\s+\d+[.:)—]?\s*[^\n]*)\n/g,/\n\s*(Capítulo\s+\d+[.:)—]?\s*[^\n]*)\n/gi,/\n\s*(PART\s+[IVXLC\d]+[.:)—]?\s*[^\n]*)\n/gi,/\n\s*(\d+\.\s+[A-Z][^\n]{3,60})\n/g];
  let chapters=[];
  for(const p of patterns){const m=[...text.matchAll(p)];if(m.length>=2){for(let i=0;i<m.length;i++){const s=m[i].index+m[i][0].length,e=i+1<m.length?m[i+1].index:text.length,c=text.slice(s,e).trim();if(c.length>100)chapters.push({id:i,title:m[i][1].trim(),content:c,words:c.split(/\s+/).length});}break;}}
  if(chapters.length<2){const w=text.split(/\s+/),cs=1500;chapters=[];for(let i=0;i<w.length;i+=cs)chapters.push({id:chapters.length,title:`Fragmento ${chapters.length+1}`,content:w.slice(i,i+cs).join(' '),words:Math.min(cs,w.length-i)});}
  return chapters;
}
// ═══ MARKDOWN (.md) — capítulos por encabezados, texto limpio para la IA ═══
function mdToPlain(md){
  return md
    .replace(/\r\n?/g,'\n')
    .replace(/<!--[\s\S]*?-->/g,'')
    .replace(/```[^\n]*\n([\s\S]*?)```/g,'$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,'')
    .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')
    .replace(/<[^>\n]+>/g,'')
    .replace(/^\s{0,3}#{1,6}\s+(.*?)\s*#*\s*$/gm,'$1')
    .replace(/^\s{0,3}>\s?/gm,'')
    .replace(/^\s*[-*+]\s+/gm,'• ')
    .replace(/^\s*([-*_]\s*){3,}$/gm,'')
    .replace(/^\|?(\s*:?-{2,}:?\s*\|)+\s*:?-*:?\s*\|?\s*$/gm,'')
    .replace(/^\|(.*)\|\s*$/gm,(m,row)=>row.split('|').map(x=>x.trim()).join(' · '))
    .replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g,'$2')
    .replace(/(^|[^\w*])\*(?=\S)([^*\n]*?\S)\*(?![\w*])/g,'$1$2')
    .replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g,'$1$2')
    .replace(/`([^`\n]+)`/g,'$1')
    .replace(/[ \t]+\n/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
function splitMarkdownChapters(md){
  const text=md.replace(/\r\n?/g,'\n').replace(/^﻿/,'').replace(/^---\n[\s\S]*?\n---\n/,'');
  const lines=text.split('\n'); const heads=[]; let inCode=false;
  lines.forEach((ln,i)=>{
    if(/^\s*```/.test(ln)){inCode=!inCode;return;}
    if(inCode) return;
    const m=ln.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
    if(m) heads.push({i,lvl:m[1].length,title:m[2].replace(/[*_`]/g,'').trim()});
  });
  const build=(lvl)=>{
    const hs=heads.filter(h=>h.lvl===lvl); if(hs.length<2) return null;
    const out=[]; let carry='', carryW=0;
    const intro=mdToPlain(lines.slice(0,hs[0].i).join('\n'));
    hs.forEach((h,k)=>{
      const end=k+1<hs.length?hs[k+1].i:lines.length;
      const body=mdToPlain(lines.slice(h.i+1,end).join('\n'));
      const words=body.split(/\s+/).filter(Boolean).length;
      // secciones cortas: se unen al capítulo anterior (o al siguiente si aún no hay ninguno)
      if(words<120 && out.length){ const prev=out[out.length-1]; prev.content+=`\n\n${h.title}\n\n${body}`; prev.words+=words; return; }
      if(words<120){ carry+=`${h.title}\n\n${body}\n\n`; carryW+=words; return; }
      out.push({id:out.length,title:h.title.slice(0,120),content:carry+body,words:words+carryW}); carry=''; carryW=0;
    });
    if(carry && out.length===0 && carryW>0) out.push({id:0,title:hs[0].title.slice(0,120),content:carry.trim(),words:carryW});
    if(out.length && intro.split(/\s+/).length>150) out.unshift({id:-1,title:'Introducción',content:intro,words:intro.split(/\s+/).length});
    out.forEach((c,i)=>c.id=i);
    return out.length>=2?out:null;
  };
  const cands=[1,2,3].map(build).filter(Boolean);
  const good=cands.find(c=>c.length>=3 && c.reduce((a,x)=>a+x.words,0)/c.length<=12000);
  const best=good||cands.sort((a,b)=>b.length-a.length)[0];
  return best||splitIntoChapters('\n'+mdToPlain(text)+'\n');
}

// Heuristic: guess gender from voice name
function guessGender(voiceName) {
  const name = voiceName.toLowerCase();
  const femaleNames = ['monica','lucia','elena','conchita','paulina','angela','maria','sofia','isabel','sara','kate','emily','serena','martha','victoria','fiona','karen','veena','samantha','alex','siri'];
  const maleNames   = ['jorge','diego','juan','miguel','carlos','daniel','oliver','arthur','george','james','tom','lee','mark'];
  if(femaleNames.some(n => name.includes(n))) return 'female';
  if(maleNames.some(n => name.includes(n))) return 'male';
  // Last letter heuristic: names ending in 'a' tend to be female
  const firstName = voiceName.split(' ')[0];
  if(/a$/i.test(firstName)) return 'female';
  return 'male';
}

function getVoicesForGroup(groupId, allVoices) {
  const group = LANG_GROUPS.find(g => g.id === groupId);

  return allVoices.filter(v =>

  );
}

// ═══ TTS COMPONENT ═══
function TTSBar({ text }) {
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const [speed, setSpeed] = useState(1);
  const [allVoices, setAllVoices] = useState([]);
  const [selectedVoiceName, setSelectedVoiceName] = useState(() => LS.get('sq_tts_voicename',''));
  const [showVoiceMenu, setShowVoiceMenu] = useState(false);
  const uttRef = useRef(null);
  const intervalRef = useRef(null);

  useEffect(() => {
    function load() {
      const v = window.speechSynthesis?.getVoices() || [];
      if(v.length > 0) {
        // Show ALL voices so user can see what's available, filter only Indo/etc
        const EXCLUDE = ['id','ms','th','vi','hi','zh','ja','ko','ar','tr','nl','pl','ru','cs','hu','ro','da','fi','nb','sv','he','uk','el'];
        const filtered = v.filter(x => !EXCLUDE.some(l => x.lang.toLowerCase().startsWith(l)));
        setAllVoices(filtered);
        if(!LS.get('sq_tts_voicename','')) {
          const def = filtered.find(x => x.lang.startsWith('es')) || filtered[0];
          if(def) { setSelectedVoiceName(def.name); LS.set('sq_tts_voicename', def.name); }
        }
      }
    }

    // iOS Safari: voices load async, need multiple attempts
    load();
    window.speechSynthesis?.addEventListener('voiceschanged', load);

    // Force iOS to load voices: speak empty utterance


    // Retry every 300ms for 3 seconds (iOS needs this)
    let attempts = 0;
    const retry = setInterval(() => {
      attempts++;
      load();
      if(attempts >= 10 || (window.speechSynthesis?.getVoices().length > 0)) {
        clearInterval(retry);
      }
    }, 300);

    const sync = () => setSelectedVoiceName(LS.get('sq_tts_voicename',''));
    window.addEventListener('tts-voice-changed', sync);

    return () => {
      window.speechSynthesis?.removeEventListener('voiceschanged', load);
      window.removeEventListener('tts-voice-changed', sync);
      clearInterval(retry);
    };
  }, []);

  const currentVoice = allVoices.find(v => v.name === selectedVoiceName) || allVoices[0];

  // Divide el texto en frases cortas: iOS falla con textos largos en un solo bloque
  function chunkText(t){
    const clean=(t||'').replace(/\s+/g,' ').trim(); if(!clean) return [];
    const parts=clean.match(/[^.!?¡¿;:\n]+[.!?;:]*\s*/g)||[clean];
    const out=[]; let buf='';
    for(const raw of parts){
      let piece=raw;
      while(piece.length>220){ const cut=piece.lastIndexOf(' ',220)>60?piece.lastIndexOf(' ',220):220; if(buf){out.push(buf.trim());buf='';} out.push(piece.slice(0,cut).trim()); piece=piece.slice(cut); }
      if((buf+piece).length>220){ if(buf.trim()) out.push(buf.trim()); buf=piece; } else buf+=piece;
    }
    if(buf.trim()) out.push(buf.trim());
    return out;
  }
  const queueRef = useRef({chunks:[],i:0,run:0});
  const [ttsError,setTtsError]=useState('');

  function stopSpeech(){
    queueRef.current.run++;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    clearInterval(intervalRef.current);
    setPlaying(false); setProgress(0);
  }

  function speakChunk(run){
    const q=queueRef.current; const synth=window.speechSynthesis;
    if(run!==q.run) return;
    if(q.i>=q.chunks.length){ stopSpeech(); return; }
    const utt=new SpeechSynthesisUtterance(q.chunks[q.i]);
    const v=currentVoice || (window.speechSynthesis.getVoices()||[]).find(x=>x.lang&&x.lang.toLowerCase().startsWith('es'));
    if(v){ utt.voice=v; utt.lang=v.lang; } else utt.lang='es-ES';
    utt.rate=speed; utt.pitch=1; utt.volume=1;
    utt.onend=()=>{ if(run!==q.run) return; q.i++; setProgress(Math.round(q.i/q.chunks.length*100)); speakChunk(run); };
    utt.onerror=(e)=>{ if(run!==q.run) return; if(e&&(e.error==='interrupted'||e.error==='canceled')) return;
      setTtsError('No se pudo reproducir la voz ('+(e&&e.error||'error')+'). Prueba con otra voz.'); stopSpeech(); };
    uttRef.current=utt; // evita que el navegador lo libere antes de tiempo
    synth.speak(utt);
  }

  function speak() {
    const synth=window.speechSynthesis;
    if(!synth || typeof SpeechSynthesisUtterance==='undefined'){ setTtsError('Este navegador no tiene voz. Abre la app en Safari.'); return; }
    if(playing){ stopSpeech(); return; }
    setTtsError('');
    const chunks=chunkText(text);
    if(!chunks.length) return;
    try{ synth.cancel(); }catch(e){}
    const q=queueRef.current; q.run++; q.chunks=chunks; q.i=0;
    const run=q.run;
    setPlaying(true); setProgress(0);
    // Chrome de escritorio se pausa solo a los ~15 s; en iPhone pause/resume rompe la voz, así que solo fuera de iOS
    clearInterval(intervalRef.current);
    const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(!isIOS) intervalRef.current=setInterval(()=>{ if(synth.speaking&&!synth.paused){ synth.pause(); synth.resume(); } },10000);
    // Debe llamarse dentro del toque del usuario (iOS lo exige): sin await ni setTimeout antes
    speakChunk(run);
    if(synth.paused) synth.resume();
  }

  function selectVoice(name) {
    setSelectedVoiceName(name);
    LS.set('sq_tts_voicename', name);
    setShowVoiceMenu(false);
    if(playing) stopSpeech();
  }

  useEffect(() => () => { queueRef.current.run++; try{window.speechSynthesis?.cancel();}catch(e){} clearInterval(intervalRef.current); }, []);
  // Si cambia el texto (p. ej. al traducir), se detiene la lectura anterior
  useEffect(() => { if(playing) stopSpeech(); }, [text]);

  // Get accent flag for a voice
  function voiceFlag(v) {
    if(!v) return '🔊';
    if(v.lang.startsWith('es-ES')||v.lang==='es_ES') return '🇪🇸';
    if(v.lang.startsWith('es-MX')||v.lang==='es_MX') return '🇲🇽';
    if(v.lang.startsWith('es-AR')) return '🇦🇷';
    if(v.lang.startsWith('es-CO')) return '🇨🇴';
    if(v.lang.startsWith('es-US')) return '🌎';
    if(v.lang.startsWith('es')) return '🌍';
    if(v.lang.startsWith('en-GB')||v.lang==='en_GB') return '🇬🇧';
    if(v.lang.startsWith('en-AU')) return '🇦🇺';
    if(v.lang.startsWith('en-US')||v.lang==='en_US') return '🇺🇸';
    if(v.lang.startsWith('en')) return '🌐';
    return '🔊';
  }

  const esVoices = allVoices.filter(v => v.lang.startsWith('es'));
  const enVoices = allVoices.filter(v => v.lang.startsWith('en'));

  return (
    <>
      {/* Compact single-row TTS bar */}
      <div className="tts-bar" style={{padding:'10px 14px',gap:8}}>
        {/* Play button */}
        <button className="btn btn-primary btn-sm" onClick={speak} style={{flexShrink:0}}>
          {playing ? '⏹' : '🔊'}
        </button>

        {/* Progress bar */}
        <div className="tts-progress" style={{flex:1}}>
          <div className="tts-fill" style={{width:`${progress}%`}}/>
        </div>

        {/* Speed toggle */}
        <button className="btn btn-secondary btn-sm" onClick={()=>{ setSpeed(s=>s===1?1.25:s===1.25?1.5:s===1.5?0.85:1); if(playing) stopSpeech(); }} style={{flexShrink:0,minWidth:42,fontSize:13}}>
          {speed}x
        </button>

        {/* Voice selector button — compact */}
        <button
          onClick={()=>setShowVoiceMenu(true)}
          style={{flexShrink:0,display:'flex',alignItems:'center',gap:5,padding:'7px 12px',borderRadius:10,border:'1.5px solid rgba(6,182,212,0.4)',background:'rgba(6,182,212,0.1)',cursor:'pointer',fontSize:14,fontFamily:'Plus Jakarta Sans',fontWeight:700,color:'#67e8f9',whiteSpace:'nowrap'}}>
          {voiceFlag(currentVoice)}
          <span style={{fontSize:12,maxWidth:70,overflow:'hidden',textOverflow:'ellipsis'}}>
            {currentVoice ? currentVoice.name.split(' ')[0] : 'Voz'}
          </span>
          <span style={{fontSize:11,color:'#475569'}}>▾</span>
        </button>
      </div>

      {ttsError && <div style={{fontSize:13,color:'#fca5a5',margin:'-6px 0 12px',lineHeight:1.5}}>⚠️ {ttsError}</div>}

      {/* Voice picker modal */}
      {showVoiceMenu && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowVoiceMenu(false)}>
          <div className="modal-sheet" style={{maxHeight:'70vh'}}>
            <div className="modal-handle"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
              <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)'}}>🔊 Seleccionar voz</div>
              <button className="btn btn-secondary btn-sm" onClick={()=>setShowVoiceMenu(false)}>✕</button>
            </div>

            {allVoices.length === 0 && (

                ⚠️ Cargando voces... si no aparecen:<br/>
                <strong>iPhone:</strong> Ajustes → Accesibilidad → Contenido hablado → Voces<br/>

              </div>
            )}
          </div>
        </div>
      )}
    </>
  );
}

// ═══ STATS SCREEN ═══
function StatsScreen({ books, progress, tokens, feynmanNotes, conquests }) {
  const totalChapters = books.reduce((a,b)=>a+(b.chapters?.length||0),0);
  const completedChapters = Object.keys(progress||{}).length;
  const totalWords = books.reduce((a,b)=>a+(b.chapters||[]).reduce((c,ch)=>c+(ch.words||0),0),0);
  const countriesConquered = (conquests||[]).length;
  const today = new Date().toDateString();
  const studyStreak = LS.get('sq_streak',{last:'',count:0});

  const stats = [
    { icon:'📚', label:'Libros cargados', value:books.length, color:'#06b6d4' },
    { icon:'✅', label:'Capítulos leídos', value:completedChapters, color:'#10b981' },
    { icon:'📝', label:'Palabras estudiadas', value:totalWords.toLocaleString(), color:'#8b5cf6' },
    { icon:'🏆', label:'Tokens totales', value:tokens, color:'#f59e0b' },
    { icon:'🌍', label:'Países conquistados', value:countriesConquered, color:'#ef4444' },
    { icon:'🧠', label:'Análisis Feynman', value:(feynmanNotes||[]).length, color:'#ec4899' },
  ];

  return (
    <div className="scroll-area fade-up">
      <div style={{marginBottom:24}}>
        <div className="font-display" style={{fontSize:27,fontWeight:800,color:'var(--text)',marginBottom:4}}>📊 Estadísticas</div>
        <div style={{fontSize:19,color:'var(--muted)'}}>Tu progreso de aprendizaje</div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:20}}>
        {stats.map(s=>(
          <div key={s.label} className="stat-card">
            <div style={{fontSize:26,marginBottom:6}}>{s.icon}</div>
            <div className="font-display" style={{fontWeight:800,fontSize:20,color:s.color}}>{s.value}</div>
            <div style={{fontSize:19,color:'var(--muted)',marginTop:2,lineHeight:1.3}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Progress por libro */}
      {books.length>0 && (
        <div className="glass-card" style={{padding:18,marginBottom:16}}>
          <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:14}}>Progreso por libro</div>
          {books.map((book,i)=>{
            const done=book.chapters?.filter(ch=>progress?.[`${book.id}_${ch.id}`]).length||0;
            const total=book.chapters?.length||1;
            const pct=Math.round((done/total)*100);
            return(
              <div key={book.id} style={{marginBottom:14}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                  <span style={{fontSize:19,color:'var(--text)',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{book.title}</span>
                  <span className="badge badge-cyan">{pct}%</span>
                </div>
                <div className="progress-track">
                  <div className="progress-fill-cyan" style={{width:`${pct}%`}}/>
                </div>
                <div style={{fontSize:19,color:'var(--muted)',marginTop:4}}>{done}/{total} capítulos</div>
              </div>
            );
          })}
        </div>
      )}

      {/* Feynman notes */}
      {feynmanNotes?.length>0 && (
        <div className="glass-card" style={{padding:18,marginBottom:16}}>
          <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:14}}>Últimos análisis Feynman</div>
          {feynmanNotes.slice(-3).reverse().map((n,i)=>(
            <div key={i} style={{padding:'10px 14px',background:'var(--surface)',borderRadius:10,marginBottom:8,border:'1px solid var(--border)'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span style={{fontSize:18,fontWeight:700,color:'var(--text)'}}>{n.chapter}</span>
                <span style={{fontSize:18,color:n.score>=80?'#6ee7b7':n.score>=60?'#67e8f9':'#fca5a5',fontWeight:700}}>{n.score}/100</span>
              </div>
              <div style={{fontSize:19,color:'var(--muted)'}}>{new Date(n.date).toLocaleDateString('es-ES')}</div>
            </div>
          ))}
        </div>
      )}

      {/* Países conquistados */}
      {conquests?.length>0 && (
        <div className="glass-card" style={{padding:18}}>
          <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:14}}>🌍 Conquistas europeas</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {conquests.map(cid=>{const c=EUROPEAN_COUNTRIES.find(x=>x.id===cid);return c?(<span key={cid} style={{fontSize:24}} title={c.name}>{c.flag}</span>):null;})}
          </div>
        </div>
      )}
    </div>
  );
}

// ═══ CONQUEST CITY SCREEN ═══
function ConquestScreen({ tokens, city, conquests, onBuyBuilding, onConquerCountry, onEarnTokens }) {
  const [selectedCountry, setSelectedCountry] = useState(null);
  const [showShop, setShowShop] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = (msg, type='success') => setToast({msg,type,key:Date.now()});

  // Get first non-conquered country as active
  const activeCountry = EUROPEAN_COUNTRIES.find(c => !conquests.includes(c.id));
  const currentCountry = selectedCountry || activeCountry;
  const countryBuildings = currentCountry ? (city[currentCountry.id] || []) : [];
  const countryBuildingDefs = countryBuildings.map(id => ({...COUNTRY_BUILDINGS[id], id, w:1, h:2}));
  const totalCountryTokens = countryBuildings.reduce((a,id)=>a+(COUNTRY_BUILDINGS[id]?.cost||0),0);
  const needed = currentCountry?.tokensNeeded || 0;
  const pct = Math.min(100, Math.round((totalCountryTokens/needed)*100));
  const isConquered = currentCountry && conquests.includes(currentCountry.id);
  const availableBuildings = currentCountry ? currentCountry.buildings.filter(b => !countryBuildings.includes(b)) : [];

  function buyBuilding(buildingId) {
    const def = COUNTRY_BUILDINGS[buildingId];
    if(!def || tokens < def.cost) return;
    const newCity = {...city, [currentCountry.id]: [...(city[currentCountry.id]||[]), buildingId]};
    onBuyBuilding(newCity, def.cost);
    setShowShop(false);

    // Check conquest
    const newTotal = (city[currentCountry.id]||[]).reduce((a,id)=>a+(COUNTRY_BUILDINGS[id]?.cost||0),0) + def.cost;
    if(newTotal >= needed && !isConquered) {
      setTimeout(()=>{
        onConquerCountry(currentCountry.id);
        onEarnTokens(currentCountry.bonus, `🏆 ¡${currentCountry.flag} ${currentCountry.name} conquistada!`);
        showToast(`¡¡CONQUISTA!! ${currentCountry.flag} ${currentCountry.name} +${currentCountry.bonus} tokens 🎉`, 'conquest');
      }, 500);
    }
  }

  return (
    <div className="scroll-area fade-up">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
        <div>
          <div className="font-display" style={{fontSize:27,fontWeight:800,color:'var(--text)',marginBottom:4}}>🌍 Europa</div>
          <div style={{fontSize:19,color:'var(--muted)'}}>Conquista países con tu estudio</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div className="font-display grad-gold" style={{fontSize:26,fontWeight:800,lineHeight:1}}>{tokens}</div>
          <div style={{fontSize:19,color:'var(--muted)'}}>StudyTokens</div>
        </div>
      </div>

      {/* Country selector */}
      <div style={{display:'flex',gap:8,overflowX:'auto',marginBottom:16,paddingBottom:4}}>
        {EUROPEAN_COUNTRIES.map(c=>{
          const conquered=conquests.includes(c.id);
          const isActive=currentCountry?.id===c.id;
          return(
            <button key={c.id} onClick={()=>setSelectedCountry(c)}
              style={{flexShrink:0,padding:'8px 14px',borderRadius:20,border:`2px solid ${isActive?c.color:'transparent'}`,background:conquered?`${c.color}22`:isActive?`${c.color}11`:'rgba(15,23,42,0.6)',cursor:'pointer',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap',transition:'all 0.2s'}}>
              <span style={{fontSize:18}}>{c.flag}</span>
              <span style={{fontSize:18,fontWeight:700,color:conquered?c.color:isActive?c.color:'#64748b',fontFamily:'Plus Jakarta Sans'}}>{conquered?'✓ ':''}{c.name}</span>
            </button>
          );
        })}
      </div>

      {currentCountry && (
        <>
          {/* Current country header */}
          <div style={{background:`linear-gradient(135deg,${currentCountry.color}22,${currentCountry.color}08)`,border:`1px solid ${currentCountry.color}44`,borderRadius:20,padding:18,marginBottom:16,position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',top:-20,right:-20,fontSize:80,opacity:0.1}}>{currentCountry.flag}</div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
              <div>
                <div style={{fontSize:28,marginBottom:4}}>{currentCountry.flag}</div>
                <div className="font-display" style={{fontWeight:800,fontSize:20,color:'var(--text)'}}>{currentCountry.name}</div>
                <div style={{fontSize:18,color:'var(--muted)'}}>{currentCountry.description}</div>
              </div>
              {isConquered ? (
                <div style={{background:`${currentCountry.color}33`,border:`1px solid ${currentCountry.color}66`,borderRadius:12,padding:'8px 14px',textAlign:'center'}}>
                  <div style={{fontSize:20}}>🏆</div>
                  <div style={{fontSize:19,color:currentCountry.color,fontWeight:700}}>Conquistado</div>
                </div>
              ):(
                <div style={{textAlign:'right'}}>
                  <div className="font-display" style={{fontSize:23,fontWeight:800,color:currentCountry.color}}>{pct}%</div>
                  <div style={{fontSize:19,color:'var(--muted)'}}>{totalCountryTokens}/{needed} ST</div>
                </div>
              )}
            </div>
            {!isConquered && (
              <>
                <div className="progress-track" style={{marginBottom:6}}>
                  <div style={{height:'100%',background:`linear-gradient(90deg,${currentCountry.color},${currentCountry.color}aa)`,borderRadius:3,width:`${pct}%`,transition:'width 0.6s ease',boxShadow:`0 0 8px ${currentCountry.color}66`}}/>
                </div>
                <div style={{fontSize:19,color:'var(--muted)'}}>+{currentCountry.bonus} tokens bonus al conquistar</div>
              </>
            )}
            {isConquered && (
              <div style={{marginTop:8,padding:'8px 12px',background:`${currentCountry.color}22`,borderRadius:10,fontSize:18,color:currentCountry.color,fontWeight:600}}>
                🎉 +{currentCountry.bonus} tokens obtenidos por conquista
              </div>
            )}
          </div>

          {/* City canvas */}
          <div style={{marginBottom:16,borderRadius:16,overflow:'hidden',border:`1px solid ${currentCountry.color}33`,boxShadow:`0 0 20px ${currentCountry.color}15`,position:'relative'}}>
            {countryBuildingDefs.length===0?(
              <div style={{textAlign:'center',padding:'36px 20px',background:'var(--surface2)'}}>
                <div style={{fontSize:36,marginBottom:8}}>{currentCountry.flag}</div>
                <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)',marginBottom:4}}>Ciudad vacía</div>
                <div style={{fontSize:18,color:'var(--muted)'}}>Compra edificios para construir {currentCountry.name}</div>
              </div>
            ):<PixelCity buildings={countryBuildingDefs} country={currentCountry}/>}
          </div>

          {/* Buildings grid */}
          <div className="glass-card" style={{padding:18,marginBottom:16}}>
            <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)',marginBottom:12}}>Edificios en {currentCountry.name}</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
              {currentCountry.buildings.map(bid=>{
                const def=COUNTRY_BUILDINGS[bid];
                const built=countryBuildings.includes(bid);
                return(
                  <div key={bid} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,width:64}}>
                    <div className={`building-slot ${built?'filled':''}`} title={def?.label} style={{opacity:built?1:0.75}}>
                      <BuildingArt id={bid} country={currentCountry} size={54} dim={!built}/>
                    </div>
                    <div style={{fontSize:12,lineHeight:1.15,textAlign:'center',color:built?'var(--text)':'var(--muted)'}}>{def?.label}</div>
                  </div>
                );
              })}
            </div>
            {!isConquered && availableBuildings.length>0 && (
              <button className="btn btn-primary btn-full" style={{marginTop:14}} onClick={()=>setShowShop(true)}>
                🏗️ Construir edificio
              </button>
            )}
            {isConquered && (
              <div style={{marginTop:12,textAlign:'center',fontSize:19,color:'#6ee7b7',fontWeight:600}}>
                ✅ País completamente construido
              </div>
            )}
          </div>

          {/* All countries overview */}
          <div className="glass-card" style={{padding:18}}>
            <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)',marginBottom:14}}>Mapa de conquistas</div>
            {EUROPEAN_COUNTRIES.map(c=>{
              const conquered=conquests.includes(c.id);
              const cBuildings=city[c.id]||[];
              const cTotal=cBuildings.reduce((a,id)=>a+(COUNTRY_BUILDINGS[id]?.cost||0),0);
              const cPct=Math.min(100,Math.round((cTotal/c.tokensNeeded)*100));
              return(
                <div key={c.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid rgba(51,65,85,0.3)'}} onClick={()=>setSelectedCountry(c)}>
                  <span style={{fontSize:22}}>{c.flag}</span>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                      <span className="font-display" style={{fontSize:19,fontWeight:700,color:conquered?c.color:'var(--text)'}}>{c.name}</span>
                      <span style={{fontSize:19,color:'var(--muted)'}}>{conquered?'🏆':cPct+'%'}</span>
                    </div>
                    <div className="progress-track" style={{height:4}}>
                      <div style={{height:'100%',background:conquered?`linear-gradient(90deg,${c.color},${c.color}aa)`:c.color+'66',borderRadius:2,width:`${conquered?100:cPct}%`,transition:'width 0.4s'}}/>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}

      {/* Shop modal */}
      {showShop && currentCountry && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowShop(false)}>
          <div className="modal-sheet">
            <div className="modal-handle"/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
              <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)'}}>{currentCountry.flag} Construir en {currentCountry.name}</div>
              <button className="btn btn-secondary btn-sm" onClick={()=>setShowShop(false)}><Icons.X/></button>
            </div>
            <div style={{fontSize:18,color:'var(--muted)',marginBottom:14}}>Tienes {tokens} StudyTokens</div>
            {availableBuildings.map(bid=>{
              const def=COUNTRY_BUILDINGS[bid];
              const canAfford=tokens>=def.cost;
              return(
                <div key={bid} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',background:'var(--surface)',borderRadius:14,border:'1px solid rgba(51,65,85,0.4)',marginBottom:8}}>
                  <BuildingArt id={bid} country={currentCountry} size={64}/>
                  <div style={{flex:1}}>
                    <div className="font-display" style={{fontWeight:700,fontSize:19,color:'var(--text)'}}>{def.label}</div>
                    <div style={{fontSize:18,color:'var(--muted)'}}>{def.cost} StudyTokens</div>
                  </div>
                  <button className={`btn btn-sm ${canAfford?'btn-gold':'btn-secondary'}`} onClick={()=>canAfford&&buyBuilding(bid)} disabled={!canAfford}>
                    {canAfford?'Construir':'Sin tokens'}
                  </button>
                </div>
              );
            })}
            {availableBuildings.length===0 && <div style={{textAlign:'center',color:'#6ee7b7',padding:20,fontSize:18}}>¡Todos los edificios construidos! 🎉</div>}
          </div>
        </div>
      )}

      {toast && <Toast key={toast.key} message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </div>
  );
}

// ═══ LIBRARY SCREEN (multi-book) ═══
function LibraryScreen({ books, activeBookId, onBookLoad, onSelectBook, onDeleteBook, onChapterSelect, progress }) {
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  const [showBooks,setShowBooks]=useState(false);
  const fileRef=useRef(null);

  const activeBook = books.find(b=>b.id===activeBookId) || books[0];

  async function handleFile(e){
    const file=e.target.files[0]; if(!file)return;
    setLoading(true); setError('');
    try{
      const text=await extractTextFromFile(file);
      const chapters=isMarkdownFile(file)?splitMarkdownChapters(text):splitIntoChapters(text);
      if(!chapters.length) throw new Error('No se detectaron capítulos.');
      const newBook={ id:Date.now(), title:file.name.replace(/\.[^.]+$/,''), chapters, loadedAt:Date.now() };
      onBookLoad(newBook);
    }catch(err){setError(err.message);}finally{setLoading(false); e.target.value='';}
  }

  const bookProgress=(book)=>{
    const done=book.chapters?.filter(ch=>progress?.[`${book.id}_${ch.id}`]).length||0;
    return {done, total:book.chapters?.length||0, pct:Math.round((done/(book.chapters?.length||1))*100)};
  };

  return(
    <div className="scroll-area fade-up">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div>
          <div className="font-display" style={{fontSize:27,fontWeight:800,color:'var(--text)',marginBottom:4}}>📚 Biblioteca</div>
          <div style={{fontSize:19,color:'var(--muted)'}}>{books.length} libro(s) cargado(s)</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          {books.length>1&&<button className="btn btn-secondary btn-sm" onClick={()=>setShowBooks(true)}>📂 Mis libros</button>}
          <button className="btn btn-primary btn-sm" onClick={()=>fileRef.current.click()} disabled={loading}>
            {loading?<Spinner text=""/>:<><Icons.Upload/> Añadir</>}
          </button>
        </div>
      </div>
      <input ref={fileRef} type="file" accept=".md,.markdown,.txt,.pdf,.epub,text/markdown,text/plain,application/pdf" style={{display:'none'}} onChange={handleFile}/>

      {books.length===0&&(
        <div className="glass-card" style={{padding:36,textAlign:'center'}}>
          <div style={{fontSize:52,marginBottom:16}}>📖</div>
          <div className="font-display" style={{fontWeight:800,fontSize:20,color:'var(--text)',marginBottom:8}}>Sin libros cargados</div>
          <div style={{fontSize:19,color:'var(--muted)',marginBottom:24}}>Markdown (.md) recomendado · también TXT o PDF</div>
          <button className="btn btn-primary btn-lg" onClick={()=>fileRef.current.click()}><Icons.Upload/> Cargar primer libro</button>
          {error&&<div style={{color:'#fca5a5',fontSize:18,marginTop:14}}>{error}</div>}
        </div>
      )}

      {activeBook&&(
        <>
          <div className="glass-card" style={{padding:18,marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{activeBook.title}</div>
                <div style={{fontSize:18,color:'var(--muted)',marginTop:3}}>
                  {bookProgress(activeBook).done}/{bookProgress(activeBook).total} capítulos · <span style={{color:'#10b981'}}>{bookProgress(activeBook).pct}% completado</span>
                </div>
              </div>
            </div>
            <div className="progress-track">
              <div className="progress-fill-cyan" style={{width:`${bookProgress(activeBook).pct}%`}}/>
            </div>
          </div>

          {activeBook.chapters?.map((ch,idx)=>{
            const done=progress?.[`${activeBook.id}_${ch.id}`];
            return(
              <div key={ch.id} className={`chapter-item ${done?'completed':''}`} onClick={()=>onChapterSelect(ch,activeBook)}>
                <div style={{width:36,height:36,borderRadius:10,background:done?'rgba(16,185,129,0.12)':'rgba(15,23,42,0.8)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,border:`1px solid ${done?'rgba(16,185,129,0.4)':'rgba(51,65,85,0.5)'}`}}>
                  {done?<span style={{color:'#6ee7b7',fontSize:18}}>✓</span>:<span className="font-display" style={{color:'#475569',fontSize:19,fontWeight:700}}>{idx+1}</span>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div className="font-display" style={{fontWeight:700,fontSize:19,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ch.title}</div>
                  <div style={{fontSize:19,color:'var(--muted)',marginTop:2}}>{ch.words?.toLocaleString()} palabras</div>
                </div>
                <span style={{color:'#334155'}}><Icons.Arrow/></span>
              </div>
            );
          })}
        </>
      )}

      {/* Books modal */}
      {showBooks&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowBooks(false)}>
          <div className="modal-sheet">
            <div className="modal-handle"/>
            <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)',marginBottom:16}}>📂 Mis libros</div>
            {books.map(book=>{
              const {done,total,pct}=bookProgress(book);
              return(
                <div key={book.id} style={{padding:'14px 16px',background:'var(--surface)',borderRadius:14,border:`1px solid ${book.id===activeBookId?'rgba(6,182,212,0.4)':'rgba(51,65,85,0.4)'}`,marginBottom:8}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div className="font-display" style={{fontWeight:700,fontSize:18,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{book.title}</div>
                      <div style={{fontSize:19,color:'var(--muted)'}}>{done}/{total} capítulos · {pct}%</div>
                    </div>
                    <button className="btn btn-danger btn-sm" onClick={()=>{onDeleteBook(book.id);}} style={{marginLeft:8,padding:'4px 8px'}}>
                      <Icons.Trash/>
                    </button>
                  </div>
                  <div className="progress-track" style={{marginBottom:8}}>
                    <div className="progress-fill-cyan" style={{width:`${pct}%`}}/>
                  </div>
                  <button className="btn btn-primary btn-sm btn-full" onClick={()=>{onSelectBook(book.id);setShowBooks(false);}}>
                    {book.id===activeBookId?'Leyendo actualmente':'Seleccionar'}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ═══ READER SCREEN ═══
function ReaderScreen({chapter,book,apiKey,onEarnTokens,onComplete,alreadyDone,onSaveFeynman}){
  const [tab,setTab]=useState('read');
  const cacheKey=`${book?.id||'b'}_${chapter.id}`;
  const [translation,setTranslation]=useState(()=>AICache.get(cacheKey)?.translation||'');
  const [translating,setTranslating]=useState(false);
  const [flashcards,setFlashcards]=useState([]);
  const [flashLoading,setFlashLoading]=useState(false);
  const [currentCard,setCurrentCard]=useState(0);
  const [cardFlipped,setCardFlipped]=useState(false);
  const [cardResults,setCardResults]=useState({});
  const [feynmanText,setFeynmanText]=useState('');
  const [feynmanResult,setFeynmanResult]=useState(null);
  const [feynmanLoading,setFeynmanLoading]=useState(false);
  const [quiz,setQuiz]=useState(null);
  const [quizLoading,setQuizLoading]=useState(false);
  const [quizAnswers,setQuizAnswers]=useState({});
  const [quizDone,setQuizDone]=useState(false);
  const [reasoningAnswers,setReasoningAnswers]=useState({});
  const [reasoningResults,setReasoningResults]=useState({});
  const [reasoningLoading,setReasoningLoading]=useState({});
  const [toast,setToast]=useState(null);
  const [earnedRead,setEarnedRead]=useState(false);

  const showToast=(msg,type='success')=>setToast({msg,type,key:Date.now()});
  const displayText = translation || chapter.content;

  async function translate(){
    if(!apiKey){showToast('Configura tu API Key primero','error');return;}
    setTranslating(true);
    try{
      const words=chapter.content.split(/\s+/),cs=400;
      let result='';
      for(let i=0;i<Math.min(words.length,1200);i+=cs){
        const p=PROMPTS.translate(words.slice(i,i+cs).join(' '));
        result+=await callClaude({apiKey,...p})+'\n\n';
      }
      setTranslation(result.trim());
      AICache.set(cacheKey,{translation:result.trim()});
    }catch(err){showToast('Error: '+err.message,'error');}finally{setTranslating(false);}
  }

  function markRead(){
    if(!earnedRead){onEarnTokens(TOKENS.READ_CHAPTER,'Capítulo leído 📖');setEarnedRead(true);}
    onComplete(chapter.id);
    showToast(`+${TOKENS.READ_CHAPTER} StudyTokens! 🎉`);
  }

  async function generateFlashcards(){
    if(!apiKey){showToast('Configura tu API Key','error');return;}
    setFlashLoading(true);
    try{
      const p=PROMPTS.flashcards(chapter.content);
      const raw=await callClaude({apiKey,...p});
      const parsed=JSON.parse(raw.replace(/```json?|```/g,'').trim());
      const cards = parsed.cards || parsed.flashcards || (Array.isArray(parsed)?parsed:[]);
      console.log('Flashcards parsed:', cards.length, cards[0]);
      setFlashcards(cards);setCurrentCard(0);setCardFlipped(false);setCardResults({});
    }catch(err){showToast('Error: '+err.message,'error');}finally{setFlashLoading(false);}
  }

  function nextCard(knew){
    setCardResults(r=>({...r,[currentCard]:knew}));
    if(currentCard<flashcards.length-1){setCurrentCard(c=>c+1);setCardFlipped(false);}
    else{const correct=Object.values({...cardResults,[currentCard]:knew}).filter(Boolean).length;onEarnTokens(correct*TOKENS.FLASHCARD,`Flashcards: ${correct}/${flashcards.length} ✅`);showToast(`+${correct*TOKENS.FLASHCARD} tokens! 🃏`);}
  }

  async function evaluateFeynman(){
    if(!apiKey){showToast('Configura tu API Key','error');return;}
    if(feynmanText.trim().length<50){showToast('Escribe al menos 50 caracteres','error');return;}
    setFeynmanLoading(true);
    try{
      const p=PROMPTS.feynmanEval(chapter.content,feynmanText);
      const raw=await callClaude({apiKey,...p});
      const result=JSON.parse(raw.replace(/```json?|```/g,'').trim());
      setFeynmanResult(result);
      onSaveFeynman({chapter:chapter.title,score:result.score,date:Date.now()});
      if(result.score>=60){onEarnTokens(TOKENS.FEYNMAN,'Técnica Feynman ✅');showToast(`+${TOKENS.FEYNMAN} tokens! Feynman 🧠`);}
    }catch(err){showToast('Error: '+err.message,'error');}finally{setFeynmanLoading(false);}
  }

  async function generateQuiz(){
    if(!apiKey){showToast('Configura tu API Key','error');return;}
    setQuizLoading(true);
    try{
      const p=PROMPTS.quiz(chapter.content);
      const raw=await callClaude({apiKey,...p});
      setQuiz(JSON.parse(raw.replace(/```json?|```/g,'').trim()));
      setQuizAnswers({});setQuizDone(false);setReasoningAnswers({});setReasoningResults({});
    }catch(err){showToast('Error: '+err.message,'error');}finally{setQuizLoading(false);}
  }

  async function submitReasoning(qIdx,q,ideal,kw){
    const ans=reasoningAnswers[qIdx];
    if(!ans||ans.trim().length<20){showToast('Respuesta muy corta','error');return;}
    setReasoningLoading(l=>({...l,[qIdx]:true}));
    try{
      const p=PROMPTS.evalReasoning(q,ideal,kw,ans);
      const raw=await callClaude({apiKey,...p});
      setReasoningResults(r=>({...r,[qIdx]:JSON.parse(raw.replace(/```json?|```/g,'').trim())}));
    }catch(err){showToast('Error: '+err.message,'error');}finally{setReasoningLoading(l=>({...l,[qIdx]:false}));}
  }

  function finishQuiz(){
    const qs=quiz.questions||[];
    const mq=qs.filter(q=>q.type==='multiple');
    const correct=mq.filter((q,i)=>quizAnswers[i]===q.correct).length;
    const rp=Object.values(reasoningResults).filter(r=>r.passed).length;
    const pts=(correct+rp)*TOKENS.QUIZ_PASS;
    onEarnTokens(pts,`Quiz: ${correct}/${mq.length} correctas`);
    showToast(`+${pts} tokens! Quiz 🏆`);
    setQuizDone(true);
  }

  const scoreColor=s=>s>=80?'#6ee7b7':s>=60?'#67e8f9':'#fca5a5';
  const evalBorderCls=l=>l==='Excelente'?'eval-excellent':l==='Bien'?'eval-good':'eval-poor';

        <div style={{fontSize:19,color:'#334155',marginTop:2}}>{chapter.words?.toLocaleString()} palabras · {book?.title}</div>
      </div>
      <div style={{padding:'12px 16px 0',background:'var(--surface)',borderBottom:'1px solid rgba(51,65,85,0.3)'}}>
        <div className="tab-bar">
          {[{id:'read',label:'📖 Leer'},{id:'flashcards',label:'🃏 Flashcards'},{id:'feynman',label:'🧠 Feynman'},{id:'quiz',label:'📝 Quiz'}].map(t=>(
            <button key={t.id} className={`tab-chip ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
          ))}
        </div>
      </div>
      <div className="scroll-area">

        {tab==='read'&&(
          <div className="fade-up">
            <div style={{display:'flex',gap:10,marginBottom:14}}>
              <button className="btn btn-secondary" style={{flex:1}} onClick={translate} disabled={translating}>
                {translating?<Spinner text="Traduciendo"/>:'🌐 Traducir al español'}
              </button>
              <button className={`btn ${alreadyDone?'btn-secondary':'btn-success'}`} onClick={markRead}>
                {alreadyDone?'✓ Leído':`+${TOKENS.READ_CHAPTER}`}
              </button>
            </div>
            <TTSBar text={displayText}/>
            <div className="glass-card" style={{padding:20}}>
              {translation?(
                <>
                  <div style={{fontSize:19,color:'#06b6d4',marginBottom:14,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.8px'}}>Traducción al español</div>
                  <div className="reading-text">{translation.split('\n\n').map((p,i)=><p key={i}>{p}</p>)}</div>
                </>
              ):(
                <>
                  <div style={{fontSize:19,color:'#334155',marginBottom:14,fontWeight:600,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.8px'}}>Texto original</div>
                  <div className="reading-text">
                    {chapter.content.split('\n\n').map((p,i)=><p key={i}>{p}</p>)}
                  </div>
                </>
              )}
            </div>
          </div>
        )}

        {tab==='flashcards'&&(
          <div className="fade-up">
            {flashcards.length===0?(
              <div style={{textAlign:'center',paddingTop:40}}>
                <div style={{fontSize:56,marginBottom:16}}>🃏</div>
                <div className="font-display" style={{fontWeight:800,fontSize:22,color:'var(--text)',marginBottom:8}}>Active Recall</div>
                <div style={{fontSize:19,color:'var(--muted)',marginBottom:28}}>Flashcards inteligentes generadas con IA</div>
                <button className="btn btn-primary btn-lg" onClick={generateFlashcards} disabled={flashLoading}>

            ):(

                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>

                  <button className="btn btn-secondary btn-sm" onClick={generateFlashcards}><Icons.Refresh/> Nueva tanda</button>
                </div>
                <div className="progress-track" style={{marginBottom:18}}>
                  <div className="progress-fill-cyan" style={{width:`${(currentCard/flashcards.length)*100}%`}}/>
                </div>
                {currentCard<flashcards.length?(
                  <>
                    <div className={`flashcard ${cardFlipped?'flipped':''}`} onClick={()=>setCardFlipped(f=>!f)}>
                      <div className="flashcard-inner">
                        <div className="flashcard-front">
                          <div style={{fontSize:19,color:'#67e8f9',marginBottom:14,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.8px'}}>❓ Pregunta</div>
                          <div className="font-display" style={{fontWeight:700,fontSize:18,color:'#f1f5f9',lineHeight:1.5}}>{flashcards[currentCard]?.q}</div>
                          <div style={{fontSize:19,color:'#94a3b8',marginTop:18}}>Toca para ver respuesta</div>
                        </div>
                        <div className="flashcard-back">
                          <div style={{fontSize:19,color:'#6ee7b7',marginBottom:14,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.8px'}}>✅ Respuesta</div>
                          <div className="answer-text" style={{fontSize:18,lineHeight:1.65,color:'#e2e8f0'}}>{flashcards[currentCard]?.a}</div>
                        </div>
                      </div>
                    </div>
                    {cardFlipped&&(
                      <div style={{display:'flex',gap:12,marginTop:16}} className="fade-in">
                        <button className="btn btn-danger" style={{flex:1}} onClick={()=>nextCard(false)}><Icons.X/> No sabía</button>
                        <button className="btn btn-success" style={{flex:1}} onClick={()=>nextCard(true)}><Icons.Check/> Lo sabía</button>

                ):(
                  <div className="glass-card" style={{textAlign:'center',padding:36}}>
                    <div style={{fontSize:44,marginBottom:10}}>🎉</div>
                    <div className="font-display" style={{fontWeight:800,fontSize:20,color:'var(--text)',marginBottom:8}}>¡Completado!</div>
                    <div style={{fontSize:19,color:'var(--muted)',marginBottom:20}}>{Object.values(cardResults).filter(Boolean).length}/{flashcards.length} correctas</div>
                    <button className="btn btn-primary" onClick={()=>{setCurrentCard(0);setCardFlipped(false);setCardResults({});}}><Icons.Refresh/> Repetir</button>
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {tab==='feynman'&&(
          <div className="fade-up">
            <div className="glass-card-cyan" style={{padding:18,marginBottom:16}}>
              <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)',marginBottom:6}}>🧠 Técnica Feynman</div>
              <div style={{fontSize:19,color:'var(--muted)',lineHeight:1.7}}>Explica el capítulo como si enseñaras a alguien sin conocimiento previo.</div>

                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                  <span className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)'}}>{feynmanResult.level}</span>

                </div>
                {feynmanResult.concepts_mastered?.length>0&&(
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:19,color:'#10b981',marginBottom:6,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase'}}>✅ Dominado</div>

                        {quizAnswers[qIdx]!==undefined&&q.explanation&&(<div style={{marginTop:10,padding:'10px 14px',background:'rgba(16,185,129,0.06)',borderRadius:10,fontSize:18,color:'#6ee7b7',lineHeight:1.7,border:'1px solid rgba(16,185,129,0.15)'}}>💡 {q.explanation}</div>)}

                    )}
                    {q.type==='reasoning'&&(
                      <>
                        <textarea className="input" placeholder="Escribe tu respuesta…" value={reasoningAnswers[qIdx]||''} onChange={e=>setReasoningAnswers(a=>({...a,[qIdx]:e.target.value}))} style={{minHeight:100,marginBottom:10}} disabled={!!reasoningResults[qIdx]}/>
                        {!reasoningResults[qIdx]?(
                          <button className="btn btn-secondary btn-sm" onClick={()=>submitReasoning(qIdx,q.question,q.ideal_answer,q.keywords||[])} disabled={reasoningLoading[qIdx]||(reasoningAnswers[qIdx]||'').length<20}>
                            {reasoningLoading[qIdx]?<Spinner text="Evaluando"/>:'Evaluar respuesta'}
                          </button>
                        ):(
                          <div style={{padding:'12px 14px',background:reasoningResults[qIdx].passed?'rgba(16,185,129,0.07)':'rgba(239,68,68,0.07)',borderRadius:10,border:`1px solid ${reasoningResults[qIdx].passed?'rgba(16,185,129,0.25)':'rgba(239,68,68,0.25)'}`}}>
                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span className="font-display" style={{fontWeight:700,fontSize:19,color:reasoningResults[qIdx].passed?'#6ee7b7':'#fca5a5'}}>{reasoningResults[qIdx].passed?'✅ Aprobado':'❌ Incompleto'}</span><span style={{color:reasoningResults[qIdx].passed?'#6ee7b7':'#fca5a5',fontWeight:700}}>{reasoningResults[qIdx].score}/100</span></div>
                            <div style={{fontSize:18,color:'#64748b',lineHeight:1.7}}>{reasoningResults[qIdx].feedback}</div>
                          </div>
                        )}
                      </>
                    )}
                  </div>
                ))}
                {!quizDone&&<button className="btn btn-gold btn-full btn-lg" style={{marginTop:8}} onClick={finishQuiz}>✅ Finalizar y ganar tokens</button>}
                {quizDone&&(<div className="glass-card" style={{textAlign:'center',padding:32}}><div style={{fontSize:44,marginBottom:10}}>🏆</div><div className="font-display" style={{fontWeight:800,fontSize:20,color:'var(--text)'}}>¡Quiz completado!</div><button className="btn btn-secondary btn-sm" style={{marginTop:14}} onClick={generateQuiz}><Icons.Refresh/> Nuevo quiz</button></div>)}
              </>
            )}
          </div>
        )}
      </div>
      {toast&&<Toast key={toast.key} message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </div>
  );
}

// ═══ VOICE SETTINGS COMPONENT ═══
function VoiceSettings() {
  const [allVoices, setAllVoices] = useState([]);
  const [selectedVoiceName, setSelectedVoiceName] = useState(() => LS.get('sq_tts_voicename',''));

  useEffect(() => {
    function load() {
      const v = window.speechSynthesis?.getVoices() || [];
      if(v.length > 0) {
        const EXCLUDE = ['id','ms','th','vi','hi','zh','ja','ko','ar','tr','nl','pl','ru','cs','hu','ro','da','fi','nb','sv','he','uk','el'];
        setAllVoices(v.filter(x => !EXCLUDE.some(l => x.lang.toLowerCase().startsWith(l))));
      }
    }
    load();
    window.speechSynthesis?.addEventListener('voiceschanged', load);
    // iOS retry
    let attempts = 0;
    const retry = setInterval(() => {
      attempts++; load();
      if(attempts >= 10 || window.speechSynthesis?.getVoices().length > 0) clearInterval(retry);
    }, 300);
    return () => {
      window.speechSynthesis?.removeEventListener('voiceschanged', load);
      clearInterval(retry);
    };
  }, []);

  function selectVoice(name) {
    setSelectedVoiceName(name);
    LS.set('sq_tts_voicename', name);
    window.dispatchEvent(new Event('tts-voice-changed'));
  }

  const esVoices = allVoices.filter(v => v.lang.startsWith('es'));
  const enVoices = allVoices.filter(v => v.lang.startsWith('en'));
  // Only show other voices if they are useful (exclude Indonesian, etc.)
  const ALLOWED_OTHER = ['fr','pt','de','it','ca'];
  const otherVoices = allVoices.filter(v => !v.lang.startsWith('es') && !v.lang.startsWith('en') && ALLOWED_OTHER.some(l => v.lang.startsWith(l)));

  const VoiceButton = ({ v, accentColor='#06b6d4' }) => {
    const active = selectedVoiceName === v.name;
    const gender = guessGender(v.name);
    // Detect accent from lang
    let accent = '';
    if(v.lang==='es-ES'||v.lang==='es_ES') accent='🇪🇸';
    else if(v.lang.startsWith('es-MX')||v.lang==='es_MX') accent='🇲🇽';
    else if(v.lang.startsWith('es-AR')) accent='🇦🇷';
    else if(v.lang.startsWith('es-CO')) accent='🇨🇴';
    else if(v.lang.startsWith('es-CL')) accent='🇨🇱';
    else if(v.lang.startsWith('es-US')) accent='🌎';
    else if(v.lang.startsWith('es')) accent='🌍';
    else if(v.lang==='en-GB'||v.lang==='en_GB') accent='🇬🇧';
    else if(v.lang.startsWith('en-AU')) accent='🇦🇺';
    else if(v.lang.startsWith('en-US')||v.lang==='en_US') accent='🇺🇸';
    else if(v.lang.startsWith('en')) accent='🌐';

    return (
      <button onClick={()=>selectVoice(v.name)}
        style={{display:'flex',alignItems:'center',gap:10,width:'100%',padding:'11px 14px',borderRadius:12,border:`1.5px solid ${active?accentColor:'var(--border)'}`,background:active?`${accentColor}18`:'var(--surface2)',cursor:'pointer',textAlign:'left',transition:'all 0.15s',marginBottom:6}}>
        <span style={{fontSize:20}}>{accent}</span>
        <span style={{fontSize:18}}>{gender==='female'?'👩':'👨'}</span>
        <div style={{flex:1}}>
          <div className="font-display" style={{fontWeight:700,fontSize:19,color:active?accentColor:'var(--text)'}}>{v.name}</div>
          <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{v.lang} · {gender==='female'?'Femenina':'Masculino'}{v.localService?' · Local':' · Online'}</div>
        </div>
        {active && <span style={{color:accentColor,fontSize:21,fontWeight:800}}>✓</span>}
      </button>
    );
  };

  if(allVoices.length === 0) return (
    <div className="glass-card" style={{padding:20,marginBottom:16,textAlign:'center'}}>
      <div style={{fontSize:19,color:'var(--muted)'}}>🔊 Cargando voces del sistema...</div>
      <div style={{fontSize:19,color:'var(--muted)',marginTop:8,lineHeight:1.6}}>
        Si no aparecen voces en español, instálalas en:<br/>
        <strong>Android:</strong> Ajustes → Accesibilidad → Texto a voz → Instalar datos de voz<br/>
        <strong>iOS:</strong> Ajustes → Accesibilidad → Contenido hablado → Voces
      </div>
    </div>
  );

  return (
    <div className="glass-card" style={{padding:20,marginBottom:16}}>
      <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:4}}>🔊 Voz de Lectura</div>
      <div style={{fontSize:18,color:'var(--muted)',marginBottom:14}}>
        {allVoices.length} voces detectadas en tu dispositivo
      </div>

      {esVoices.length > 0 && (
        <>
          <div style={{fontSize:19,color:'#06b6d4',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.6px',marginBottom:8}}>
            🌍 Español — {esVoices.length} voz(ces)
          </div>
          {esVoices.map(v => <VoiceButton key={v.name} v={v} accentColor="#06b6d4"/>)}
        </>
      )}

      {esVoices.length < 2 && (
        <div style={{padding:'12px 14px',background:'rgba(245,158,11,0.08)',border:'1px solid rgba(245,158,11,0.25)',borderRadius:10,marginBottom:12,fontSize:18,color:'#fcd34d',lineHeight:1.8}}>
          {esVoices.length === 0 ? '⚠️ No hay voces en español.' : '💡 Solo hay 1 voz en español. Instala más:'}<br/>
          <strong>iPhone →</strong> Ajustes → Accesibilidad → Contenido hablado → Voces<br/>
          🇪🇸 <strong>Español (España):</strong> descarga <em>Lucía</em> (mujer) y <em>Jorge</em> (hombre)<br/>
          🇲🇽 <strong>Español (México):</strong> descarga <em>Paulina</em> (mujer) y <em>Juan</em> (hombre)
        </div>
      )}

      {enVoices.length > 0 && (
        <>
          <hr className="neon-sep"/>
          <div style={{fontSize:19,color:'#f59e0b',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.6px',marginBottom:8}}>
            🌐 English — {enVoices.length} voice(s)
          </div>
          {enVoices.map(v => <VoiceButton key={v.name} v={v} accentColor="#f59e0b"/>)}
        </>
      )}


    </div>
  );
}

        <div className="font-display" style={{fontSize:27,fontWeight:800,color:'var(--text)',marginBottom:4}}>⚙️ Configuración</div>
        <div style={{fontSize:19,color:'var(--muted)'}}>API Key, tema y preferencias</div>
      </div>

      {/* Theme toggle */}
      <div className="glass-card" style={{padding:18,marginBottom:16,display:'flex',justifyContent:'space-between',alignItems:'center'}}>

          <div className="font-display" style={{fontWeight:700,fontSize:19,color:'var(--text)',marginBottom:2}}>Modo {theme==='dark'?'Oscuro':'Claro'}</div>
          <div style={{fontSize:18,color:'var(--muted)'}}>Cambia la apariencia de la app</div>

        <div style={{display:'flex',gap:8,marginTop:12}}>

        <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:14}}>Modelos de IA</div>
        {[{name:'Haiku',model:MODELS.haiku,use:'Traducción · Flashcards',color:'#06b6d4'},{name:'Sonnet',model:MODELS.sonnet,use:'Feynman · Quiz',color:'#f59e0b'}].map(m=>(
          <div key={m.name} style={{background:'var(--surface2)',borderRadius:12,padding:'12px 14px',border:`1px solid ${m.color}55`,marginBottom:8}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
              <span className="font-display" style={{fontWeight:800,color:m.color,fontSize:19,textShadow:'0 0 20px currentColor'}}>{m.name}</span>
              <span style={{fontSize:19,fontWeight:600,color:m.color,background:`${m.color}15`,padding:'3px 10px',borderRadius:20,border:`1px solid ${m.color}30`,fontFamily:'Plus Jakarta Sans'}}>{m.use}</span>
            </div>
            <div style={{fontSize:19,color:'var(--muted)',fontFamily:'monospace',marginTop:2}}>{m.model}</div>
          </div>

      {/* ─── VOICE SELECTOR ─── */}
      <VoiceSettings/>

      <div className="glass-card" style={{padding:20}}>
        <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:8}}>StudyQuest v2.0</div>
        <div style={{fontSize:19,color:'var(--muted)',lineHeight:1.75}}>Active Recall · Técnica Feynman · Spaced Repetition · Conquista Europea · TTS · Estadísticas</div>

    </div>
  );
}

// ═══ HOME SCREEN ═══
function HomeScreen({tokens,books,activeBookId,progress,onNav,conquests}){
  const activeBook=books.find(b=>b.id===activeBookId)||books[0];
  const done=activeBook?activeBook.chapters?.filter(ch=>progress?.[`${activeBook.id}_${ch.id}`]).length||0:0;
  const total=activeBook?.chapters?.length||0;
  const pct=total>0?Math.round((done/total)*100):0;
  const now=Date.now();
  const toReview=activeBook?.chapters?.filter(ch=>{const d=progress?.[`${activeBook.id}_${ch.id}`];return d&&(now-d)>3*24*60*60*1000;})||[];
  const nextCountry=EUROPEAN_COUNTRIES.find(c=>!conquests.includes(c.id));

  return(
    <div className="scroll-area fade-up">
      <div style={{position:'relative',marginBottom:24,overflow:'hidden'}}>
        <div style={{position:'absolute',top:-40,right:-20,width:180,height:180,borderRadius:'50%',background:'radial-gradient(circle,rgba(6,182,212,0.12) 0%,transparent 70%)',pointerEvents:'none'}}/>
        <div style={{fontSize:18,color:'#06b6d4',fontWeight:700,fontFamily:'Plus Jakarta Sans',letterSpacing:'1px',textTransform:'uppercase',marginBottom:6}}>✦ Sistema de Aprendizaje</div>
        <div className="font-display" style={{fontSize:32,fontWeight:800,color:'var(--text)',letterSpacing:'-0.5px',lineHeight:1.1}}>Study<span className="grad-cyan">Quest</span></div>
      </div>

      {/* Token hero */}
      <div style={{background:'linear-gradient(135deg,rgba(6,182,212,0.1),rgba(59,130,246,0.08),rgba(139,92,246,0.06))',border:'1px solid rgba(6,182,212,0.2)',borderRadius:24,padding:20,marginBottom:16,position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-30,right:-30,width:120,height:120,borderRadius:'50%',background:'radial-gradient(circle,rgba(6,182,212,0.15) 0%,transparent 70%)'}}/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}}>
          <div>
            <div style={{fontSize:19,color:'#475569',fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:6}}>StudyTokens</div>
            <div className="font-display grad-gold" style={{fontSize:44,fontWeight:800,lineHeight:1}}>{tokens}</div>
          </div>
          <div style={{width:52,height:52,borderRadius:14,background:'rgba(245,158,11,0.12)',border:'1px solid rgba(245,158,11,0.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26}}>🏆</div>
        </div>
        <div className="progress-track" style={{height:8,marginBottom:8}}>
          <div className="progress-fill" style={{width:`${nextCountry?(Math.min(100,Math.round(((tokens%(nextCountry.tokensNeeded||200))/(nextCountry.tokensNeeded||200))*100))):100}%`,height:'100%'}}/>
        </div>
        <div style={{fontSize:19,color:'#475569'}}>
          {nextCountry?`Conquistando ${nextCountry.flag} ${nextCountry.name} · ${conquests.length}/${EUROPEAN_COUNTRIES.length} países`:`🌍 ¡Europa completamente conquistada!`}
        </div>
      </div>

      {/* Book progress */}
      {activeBook?(
        <div className="glass-card" style={{padding:18,marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{activeBook.title}</div>
            <span className="badge badge-cyan">{pct}%</span>
          </div>
          <div className="progress-track" style={{marginBottom:8}}>
            <div className="progress-fill-cyan" style={{width:`${pct}%`}}/>
          </div>
          <div style={{fontSize:18,color:'var(--muted)',marginBottom:14}}>{done}/{total} capítulos · {books.length} libro(s) en biblioteca</div>
          <button className="btn btn-primary btn-full" onClick={()=>onNav('library')}>Continuar lectura →</button>
        </div>
      ):(
        <div className="glass-card" style={{padding:28,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:40,marginBottom:10}}>📚</div>
          <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:6}}>Sin libro cargado</div>
          <button className="btn btn-primary" onClick={()=>onNav('library')}><Icons.Upload/> Cargar libro</button>
        </div>
      )}

      {/* Next country */}
      {nextCountry&&(
        <div style={{background:`linear-gradient(135deg,${nextCountry.color}15,${nextCountry.color}05)`,border:`1px solid ${nextCountry.color}33`,borderRadius:20,padding:18,marginBottom:16}}>
          <div style={{fontSize:19,color:nextCountry.color,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:8}}>🌍 Próxima conquista</div>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <span style={{fontSize:32}}>{nextCountry.flag}</span>
            <div style={{flex:1}}>
              <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)'}}>{nextCountry.name}</div>
              <div style={{fontSize:18,color:'var(--muted)'}}>{nextCountry.tokensNeeded} ST necesarios · +{nextCountry.bonus} bonus</div>
            </div>
            <button className="btn btn-sm" style={{background:`${nextCountry.color}22`,color:nextCountry.color,border:`1px solid ${nextCountry.color}44`}} onClick={()=>onNav('city')}>
              Construir
            </button>
          </div>
        </div>
      )}

      {/* Spaced repetition */}
      {toReview.length>0&&(
        <div style={{background:'rgba(239,68,68,0.05)',border:'1px solid rgba(239,68,68,0.2)',borderRadius:20,padding:18,marginBottom:16}}>
          <div className="font-display" style={{fontWeight:800,fontSize:19,color:'#fca5a5',marginBottom:6}}>🔁 Repasar hoy</div>
          <div style={{fontSize:18,color:'var(--muted)',marginBottom:12}}>Repetición espaciada — más de 3 días sin repasar</div>
          {toReview.slice(0,3).map(ch=>(
            <div key={ch.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid rgba(51,65,85,0.3)'}}>
              <span style={{fontSize:19,color:'#94a3b8',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ch.title}</span>
              <button className="btn btn-secondary btn-sm" onClick={()=>onNav('library')}>Repasar</button>
            </div>
          ))}
        </div>
      )}

      {/* Quick actions */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {[{icon:'🌍',label:'Mapa Europa',nav:'city',color:'#10b981'},{icon:'📊',label:'Estadísticas',nav:'stats',color:'#8b5cf6'}].map(a=>(
          <button key={a.nav} className="glass-card" style={{cursor:'pointer',textAlign:'center',padding:'22px 16px'}} onClick={()=>onNav(a.nav)}>
            <div style={{fontSize:32,marginBottom:8}}>{a.icon}</div>
            <div className="font-display" style={{fontSize:19,fontWeight:700,color:'var(--text)'}}>{a.label}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ═══ APP ROOT ═══
function App(){
  const [apiKey,setApiKey]=useState(()=>LS.get('sq_apikey',''));
  const [tokens,setTokens]=useState(()=>LS.get('sq_tokens',0));
  const [city,setCity]=useState(()=>LS.get('sq_city2',{}));
  const [books,setBooks]=useState(()=>LS.get('sq_books',[]));
  const [activeBookId,setActiveBookId]=useState(()=>LS.get('sq_activebook',null));
  const [progress,setProgress]=useState(()=>LS.get('sq_progress2',{}));
  const [conquests,setConquests]=useState(()=>LS.get('sq_conquests',[]));
  const [feynmanNotes,setFeynmanNotes]=useState(()=>LS.get('sq_feynman_notes',[]));
  const [theme,setTheme]=useState(()=>LS.get('sq_theme','dark'));
  const [activeNav,setActiveNav]=useState('home');
  const [selectedChapter,setSelectedChapter]=useState(null);
  const [selectedBook,setSelectedBook]=useState(null);
  const [toast,setToast]=useState(null);
  const [onboardKey,setOnboardKey]=useState(()=>LS.get('sq_apikey','')||'');

  useEffect(()=>{ LS.set('sq_apikey',apiKey); },[apiKey]);
  useEffect(()=>{ LS.set('sq_tokens',tokens); },[tokens]);
  useEffect(()=>{ LS.set('sq_city2',city); },[city]);
  useEffect(()=>{ LS.set('sq_books',books); },[books]);
  useEffect(()=>{ LS.set('sq_activebook',activeBookId); },[activeBookId]);
  useEffect(()=>{ LS.set('sq_progress2',progress); },[progress]);
  useEffect(()=>{ LS.set('sq_conquests',conquests); },[conquests]);
  useEffect(()=>{ LS.set('sq_feynman_notes',feynmanNotes); },[feynmanNotes]);
  useEffect(()=>{ LS.set('sq_theme',theme); document.documentElement.setAttribute('data-theme',theme); },[theme]);

  const showToast=(msg,type='success')=>setToast({msg,type,key:Date.now()});
  const earnTokens=(amount,reason)=>{ setTokens(t=>t+amount); showToast(`+${amount} 🪙 ${reason}`); };
  const saveApiKey=(k)=>{ setApiKey(k.trim()); showToast('API Key guardada ✅'); };

  function loadBook(newBook){
    setBooks(prev=>{const exists=prev.find(b=>b.title===newBook.title);if(exists)return prev;return [...prev,newBook];});
    setActiveBookId(newBook.id);
    setActiveNav('library');
    showToast(`📚 ${newBook.chapters.length} capítulos cargados`);
  }

  function deleteBook(id){
    setBooks(prev=>prev.filter(b=>b.id!==id));
    if(activeBookId===id){ const remaining=books.filter(b=>b.id!==id); setActiveBookId(remaining[0]?.id||null); }
  }

  function completeChapter(chapterId){
    const key=`${selectedBook?.id||activeBookId}_${chapterId}`;
    setProgress(p=>({...p,[key]:Date.now()}));
  }

  function selectChapter(ch,book){ setSelectedChapter(ch); setSelectedBook(book); setActiveNav('reader'); }

  function buyBuilding(newCity, cost){ setCity(newCity); setTokens(t=>t-cost); }
  function conquerCountry(countryId){ setConquests(c=>[...c,countryId]); }
  function saveFeynmanNote(note){ setFeynmanNotes(n=>[...n,note]); }

  const navItems=[
    {id:'home',label:'Inicio',Icon:Icons.Home},
    {id:'library',label:'Libros',Icon:Icons.Book},
    {id:'city',label:'Europa',Icon:Icons.Globe},
    {id:'stats',label:'Stats',Icon:Icons.Chart},
    {id:'settings',label:'Config',Icon:Icons.Settings},
  ];

  const showReader=activeNav==='reader'&&selectedChapter;
  const chapterProgressKey=`${selectedBook?.id||activeBookId}_${selectedChapter?.id}`;

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',position:'relative'}}>
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {showReader?(
          <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{padding:'12px 16px',background:'var(--surface2)',borderBottom:'1px solid rgba(51,65,85,0.4)',backdropFilter:'blur(16px)',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
              <button className="btn btn-secondary btn-sm" onClick={()=>{setActiveNav('library');setSelectedChapter(null);setSelectedBook(null);}}>← Volver</button>
              <span style={{fontSize:18,color:'#334155',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontFamily:'Plus Jakarta Sans',fontWeight:600}}>{selectedBook?.title}</span>
              <span className="badge badge-gold">{tokens} ST</span>
            </div>
            <ReaderScreen chapter={selectedChapter} book={selectedBook} apiKey={apiKey} onEarnTokens={earnTokens} onComplete={completeChapter} alreadyDone={!!progress[chapterProgressKey]} onSaveFeynman={saveFeynmanNote}/>
          </div>
        ):(
          <>
            {activeNav==='home'&&<HomeScreen tokens={tokens} books={books} activeBookId={activeBookId} progress={progress} onNav={id=>{setActiveNav(id);}} conquests={conquests}/>}
            {activeNav==='library'&&<LibraryScreen books={books} activeBookId={activeBookId} onBookLoad={loadBook} onSelectBook={setActiveBookId} onDeleteBook={deleteBook} onChapterSelect={selectChapter} progress={progress}/>}
            {activeNav==='city'&&<ConquestScreen tokens={tokens} city={city} conquests={conquests} onBuyBuilding={buyBuilding} onConquerCountry={conquerCountry} onEarnTokens={earnTokens}/>}
            {activeNav==='stats'&&<StatsScreen books={books} progress={progress} tokens={tokens} feynmanNotes={feynmanNotes} conquests={conquests}/>}
            {activeNav==='settings'&&<SettingsScreen apiKey={apiKey} onSave={saveApiKey} theme={theme} onToggleTheme={()=>setTheme(t=>t==='dark'?'light':'dark')}/>}
          </>
        )}
      </div>

      {!showReader&&(
        <nav className="bottom-nav">
          {navItems.map(item=>(
            <button key={item.id} className={`nav-item ${activeNav===item.id?'active':''}`} onClick={()=>setActiveNav(item.id)}>
              <item.Icon/>
              {item.label}
            </button>
          ))}
        </nav>
      )}

      {toast&&<Toast key={toast.key} message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}

      {!apiKey&&activeNav==='home'&&!LS.get('sq_apikey','')&&(
        <div className="modal-overlay" style={{alignItems:'center'}}>
          <div style={{width:'calc(100% - 32px)',maxWidth:400,background:'linear-gradient(180deg,#0f172a,#07111f)',borderRadius:24,padding:28,border:'1px solid rgba(6,182,212,0.2)',boxShadow:'0 24px 80px rgba(0,0,0,0.8)'}}>
            <div style={{textAlign:'center',marginBottom:24}}>
              <div style={{fontSize:56,marginBottom:12}}>🎓</div>
              <div className="font-display" style={{fontWeight:800,fontSize:26,color:'#f1f5f9',marginBottom:6,letterSpacing:'-0.5px'}}>StudyQuest</div>
              <div style={{fontSize:19,color:'#475569',lineHeight:1.7}}>Ingresa tu API Key de Anthropic para comenzar.</div>
            </div>
            <input className="input" type="password" placeholder="sk-ant-..." onChange={e=>setOnboardKey(e.target.value)} value={onboardKey} style={{marginBottom:14}}/>
            <button className="btn btn-primary btn-full btn-lg" onClick={()=>{if(onboardKey.trim())saveApiKey(onboardKey);}}>Comenzar →</button>
            <div style={{fontSize:19,color:'#1e293b',textAlign:'center',marginTop:14}}>console.anthropic.com</div>
          </div>
        </div>
      )}
    </div>
  );
}

if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
