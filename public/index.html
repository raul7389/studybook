// ═══ STATS SCREEN ═══
function StatsScreen({ books, progress, tokens, feynmanNotes, conquests, streak, stats: usage, deck, city }) {
  const totalChapters = books.reduce((a,b)=>a+(b.chapters?.length||0),0);
  const completedChapters = Object.keys(progress||{}).length;
  const totalWords = books.reduce((a,b)=>a+(b.chapters||[]).reduce((c,ch)=>c+(ch.words||0),0),0);
  const countriesConquered = (conquests||[]).length;
  const today = new Date().toDateString();
  const st = usage || {};

  const stats = [
    { icon:'📚', label:'Libros cargados', value:books.length, color:'#06b6d4' },
    { icon:'✅', label:'Capítulos leídos', value:completedChapters, color:'#10b981' },
    { icon:'📝', label:'Palabras estudiadas', value:totalWords.toLocaleString(), color:'#8b5cf6' },
    { icon:'🏆', label:'Tokens totales', value:tokens, color:'#f59e0b' },
    { icon:'🌍', label:'Países conquistados', value:countriesConquered, color:'#ef4444' },
    { icon:'🧠', label:'Análisis Feynman', value:(feynmanNotes||[]).length, color:'#ec4899' },
    { icon:'🔥', label:'Mejor racha (días)', value:(streak&&streak.best)||0, color:'#f97316' },
    { icon:'⏱️', label:'Minutos leídos', value:st.minutes||0, color:'#22d3ee' },
    { icon:'🃏', label:'Tarjetas en repaso', value:(deck||[]).length, color:'#a78bfa' },
    { icon:'🎙️', label:'Explicaciones por voz', value:st.voice||0, color:'#34d399' },
    ...(()=>{ const log=Object.values(LS.get('sq_readlog',{})||{}).filter(x=>x.passed); const w=log.filter(x=>x.wpm).map(x=>x.wpm);
      return [{ icon:'✅', label:'Lecturas verificadas', value:log.length, color:'#10b981' }, { icon:'⚡', label:'Velocidad media (ppm)', value:w.length?Math.round(w.reduce((a,b)=>a+b,0)/w.length):'—', color:'#eab308' }]; })(),
  ];

  return (
    <div className="scroll-area fade-up">
      <div style={{marginBottom:24}}>
        <div className="font-display" style={{fontSize:27,fontWeight:800,color:'var(--text)',marginBottom:4}}>📊 Estadísticas</div>
        <div style={{fontSize:19,color:'var(--muted)'}}>Tu progreso de aprendizaje</div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:20}}>
        {stats.map(s=>(
          <div key={s.label} className="stat-card">
            <div style={{fontSize:26,marginBottom:6}}>{s.icon}</div>
            <div className="font-display" style={{fontWeight:800,fontSize:20,color:s.color}}>{s.value}</div>
            <div style={{fontSize:19,color:'var(--muted)',marginTop:2,lineHeight:1.3}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Progress por libro */}
      {books.length>0 && (
        <div className="glass-card" style={{padding:18,marginBottom:16}}>
          <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:14}}>Progreso por libro</div>
          {books.map((book,i)=>{
            const done=book.chapters?.filter(ch=>progress?.[`${book.id}_${ch.id}`]).length||0;
            const total=book.chapters?.length||1;
            const pct=Math.round((done/total)*100);
            return(
              <div key={book.id} style={{marginBottom:14}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                  <span style={{fontSize:19,color:'var(--text)',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{book.title}</span>
                  <span className="badge badge-cyan">{pct}%</span>
                </div>
                <div className="progress-track">
                  <div className="progress-fill-cyan" style={{width:`${pct}%`}}/>
                </div>
                <div style={{fontSize:19,color:'var(--muted)',marginTop:4}}>{done}/{total} capítulos</div>
              </div>
            );
          })}
        </div>
      )}

      {/* Feynman notes */}
      {feynmanNotes?.length>0 && (
        <div className="glass-card" style={{padding:18,marginBottom:16}}>
          <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:14}}>Últimos análisis Feynman</div>
          {feynmanNotes.slice(-3).reverse().map((n,i)=>(
            <div key={i} style={{padding:'10px 14px',background:'var(--surface)',borderRadius:10,marginBottom:8,border:'1px solid var(--border)'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span style={{fontSize:18,fontWeight:700,color:'var(--text)'}}>{n.chapter}</span>
                <span style={{fontSize:18,color:n.score>=80?'#6ee7b7':n.score>=60?'#67e8f9':'#fca5a5',fontWeight:700}}>{n.score}/100</span>
              </div>
              <div style={{fontSize:19,color:'var(--muted)'}}>{new Date(n.date).toLocaleDateString('es-ES')}</div>
            </div>
          ))}
        </div>
      )}

      {/* Países conquistados */}
      {conquests?.length>0 && (
        <div className="glass-card" style={{padding:18}}>
          <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:14}}>🏅 Medallas de países</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {conquests.map(cid=>{const c=EUROPEAN_COUNTRIES.find(x=>x.id===cid);return c?(<span key={cid} style={{fontSize:24}} title={c.name}>{c.flag}</span>):null;})}
          </div>
        </div>
      )}
    </div>
  );
}

// ═══ LIBRARY SCREEN (multi-book) ═══
function LibraryScreen({ books, activeBookId, onBookLoad, onSelectBook, onDeleteBook, onChapterSelect, progress }) {
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  const [showBooks,setShowBooks]=useState(false);
  const fileRef=useRef(null);

  const activeBook = books.find(b=>b.id===activeBookId) || books[0];

  const [convPct,setConvPct]=useState(0);
  const [preview,setPreview]=useState(null); // {title, chapters, md, info, file}

  async function handleFile(e){
    const file=e.target.files[0]; if(!file)return;
    setLoading(true); setError(''); setConvPct(0);
    const title=file.name.replace(/\.pdf\.txt$/i,'').replace(/\.[^.]+$/,'').replace(/^\d+[-_ ]*/,'').replace(/[_]+/g,' ').trim()||file.name;
    try{
      let md=null, info=null, chapters;
      const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
      if(isPdf && window.PdfToMd && window.pdfjsLib){
        ({md,info}=await PdfToMd.fromPdf(await file.arrayBuffer(),{title,onProgress:f=>setConvPct(Math.round(f*100))}));
        chapters=splitMarkdownChapters(md);
      } else {
        const text=await extractTextFromFile(file);
        if(isMarkdownFile(file)) chapters=splitMarkdownChapters(text);
        else if(window.PdfToMd && PdfToMd.looksLikePdfText(text)){ ({md,info}=PdfToMd.fromText(text,{title})); chapters=splitMarkdownChapters(md); }
        else chapters=splitIntoChapters(text);
      }
      if(!chapters.length) throw new Error('No se detectaron capítulos.');
      if(md) setPreview({title,chapters,md,info});
      else onBookLoad({ id:Date.now(), title, chapters, loadedAt:Date.now() });
    }catch(err){setError(err.message);}finally{setLoading(false); e.target.value='';}
  }
  function savePreview(){
    onBookLoad({ id:Date.now(), title:preview.title, chapters:preview.chapters, loadedAt:Date.now(), source:'pdf' });
    setPreview(null);
  }
  function downloadMd(){
    const blob=new Blob([preview.md],{type:'text/markdown;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=preview.title.replace(/[\\/:*?"<>|]+/g,'').slice(0,80)+'.md';
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  }
  const SRC={outline:'índice del PDF (marcadores)',toc:'índice del libro',font:'tamaño de los títulos',caps:'títulos en mayúsculas',none:'tamaño (sin títulos)'};

  const bookProgress=(book)=>{
    const done=book.chapters?.filter(ch=>progress?.[`${book.id}_${ch.id}`]).length||0;
    return {done, total:book.chapters?.length||0, pct:Math.round((done/(book.chapters?.length||1))*100)};
  };

  return(
    <div className="scroll-area fade-up">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div>
          <div className="font-display" style={{fontSize:27,fontWeight:800,color:'var(--text)',marginBottom:4}}>📚 Biblioteca</div>
          <div style={{fontSize:19,color:'var(--muted)'}}>{books.length} libro(s) cargado(s)</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          {books.length>1&&<button className="btn btn-secondary btn-sm" onClick={()=>setShowBooks(true)}>📂 Mis libros</button>}
          <button className="btn btn-primary btn-sm" onClick={()=>fileRef.current.click()} disabled={loading}>
            {loading?<Spinner text={convPct?`${convPct}%`:''}/>:<><Icons.Upload/> Añadir</>}
          </button>
        </div>
      </div>
      <input ref={fileRef} type="file" accept=".md,.markdown,.txt,.pdf,.epub,text/markdown,text/plain,application/pdf" style={{display:'none'}} onChange={handleFile}/>
      {loading&&convPct>0&&(
        <div className="glass-card" style={{padding:14,marginBottom:14}}>
          <div style={{fontSize:15,color:'var(--text)',marginBottom:8}}>📄 Convirtiendo PDF a Markdown… {convPct}%</div>
          <div className="progress-track"><div className="progress-fill-cyan" style={{width:`${convPct}%`}}/></div>
        </div>
      )}
      {preview&&ReactDOM.createPortal(
        <div className="modal-overlay">
          <div className="modal-sheet" style={{maxHeight:'88vh',overflowY:'auto'}}>
            <div className="modal-handle"/>
            <div className="font-display" style={{fontWeight:800,fontSize:20,color:'var(--text)',marginBottom:4}}>📄 {preview.title}</div>
            <div style={{fontSize:14,color:'var(--muted)',marginBottom:12,lineHeight:1.6}}>
              Convertido a Markdown en tu dispositivo · {preview.info.pages} páginas · {preview.info.words.toLocaleString('es-CO')} palabras<br/>
              Capítulos detectados con: <strong style={{color:'#67e8f9'}}>{SRC[preview.info.source]||preview.info.source}</strong> · {preview.info.removed} líneas basura quitadas
            </div>
            {preview.info.warnings.map((w,i)=><div key={i} style={{fontSize:14,color:'#fcd34d',marginBottom:8}}>⚠️ {w}</div>)}
            <div style={{border:'1px solid var(--border)',borderRadius:12,maxHeight:'38vh',overflowY:'auto',marginBottom:14}}>
              {preview.chapters.map((c,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'9px 12px',borderBottom:'1px solid rgba(51,65,85,0.3)',fontSize:14}}>
                  <span style={{color:'var(--text)'}}><span style={{color:'var(--muted)'}}>{i+1}.</span> {c.title.length>70?c.title.slice(0,70)+'…':c.title}</span>
                  <span style={{color:'var(--muted)',flexShrink:0}}>~{Math.max(1,Math.round(c.words/200))} min</span>
                </div>
              ))}
            </div>
            <button className="btn btn-primary btn-full btn-lg" onClick={savePreview}>✅ Guardar {preview.chapters.length} capítulos</button>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button className="btn btn-secondary" style={{flex:1}} onClick={downloadMd}>⬇️ Descargar .md</button>
              <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setPreview(null)}>Cancelar</button>
            </div>
          </div>
        </div>, document.body
      )}

      {books.length===0&&(
        <div className="glass-card" style={{padding:36,textAlign:'center'}}>
          <div style={{fontSize:52,marginBottom:16}}>📖</div>
          <div className="font-display" style={{fontWeight:800,fontSize:20,color:'var(--text)',marginBottom:8}}>Sin libros cargados</div>
          <div style={{fontSize:19,color:'var(--muted)',marginBottom:24}}>PDF (se convierte solo a Markdown) · también .md o TXT</div>
          <button className="btn btn-primary btn-lg" onClick={()=>fileRef.current.click()}><Icons.Upload/> Cargar primer libro</button>
          {error&&<div style={{color:'#fca5a5',fontSize:18,marginTop:14}}>{error}</div>}
        </div>
      )}

      {activeBook&&(
        <>
          <div className="glass-card" style={{padding:18,marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{activeBook.title}</div>
                <div style={{fontSize:18,color:'var(--muted)',marginTop:3}}>
                  {bookProgress(activeBook).done}/{bookProgress(activeBook).total} capítulos · <span style={{color:'#10b981'}}>{bookProgress(activeBook).pct}% completado</span>
                </div>
              </div>
            </div>
            <div className="progress-track">
              <div className="progress-fill-cyan" style={{width:`${bookProgress(activeBook).pct}%`}}/>
            </div>
          </div>

          {activeBook.chapters?.map((ch,idx)=>{
            const done=progress?.[`${activeBook.id}_${ch.id}`];
            return(
              <div key={ch.id} className={`chapter-item ${done?'completed':''}`} onClick={()=>onChapterSelect(ch,activeBook)}>
                <div style={{width:36,height:36,borderRadius:10,background:done?'rgba(16,185,129,0.12)':'rgba(15,23,42,0.8)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,border:`1px solid ${done?'rgba(16,185,129,0.4)':'rgba(51,65,85,0.5)'}`}}>
                  {done?<span style={{color:'#6ee7b7',fontSize:18}}>✓</span>:<span className="font-display" style={{color:'#475569',fontSize:19,fontWeight:700}}>{idx+1}</span>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div className="font-display" style={{fontWeight:700,fontSize:19,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ch.title}</div>
                  <div style={{fontSize:19,color:'var(--muted)',marginTop:2}}>{ch.words?.toLocaleString()} palabras</div>
                </div>
                <span style={{color:'#334155'}}><Icons.Arrow/></span>
              </div>
            );
          })}
        </>
      )}

      {/* Books modal */}
      {showBooks&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowBooks(false)}>
          <div className="modal-sheet">
            <div className="modal-handle"/>
            <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)',marginBottom:16}}>📂 Mis libros</div>
            {books.map(book=>{
              const {done,total,pct}=bookProgress(book);
              return(
                <div key={book.id} style={{padding:'14px 16px',background:'var(--surface)',borderRadius:14,border:`1px solid ${book.id===activeBookId?'rgba(6,182,212,0.4)':'rgba(51,65,85,0.4)'}`,marginBottom:8}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div className="font-display" style={{fontWeight:700,fontSize:18,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{book.title}</div>
                      <div style={{fontSize:19,color:'var(--muted)'}}>{done}/{total} capítulos · {pct}%</div>
                    </div>
                    <button className="btn btn-danger btn-sm" onClick={()=>{onDeleteBook(book.id);}} style={{marginLeft:8,padding:'4px 8px'}}>
                      <Icons.Trash/>
                    </button>
                  </div>
                  <div className="progress-track" style={{marginBottom:8}}>
                    <div className="progress-fill-cyan" style={{width:`${pct}%`}}/>
                  </div>
                  <button className="btn btn-primary btn-sm btn-full" onClick={()=>{onSelectBook(book.id);setShowBooks(false);}}>
                    {book.id===activeBookId?'Leyendo actualmente':'Seleccionar'}
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ═══ READER SCREEN ═══
function ReaderScreen({chapter,book,apiKey,ai,onEarnTokens,onComplete,alreadyDone,onSaveFeynman,onStudy=()=>{},onAddCards=()=>{}}){
  const [tab,setTab]=useState('read');
  const cacheKey=`${book?.id||'b'}_${chapter.id}`;
  const [translation,setTranslation]=useState(()=>AICache.get(cacheKey)?.translation||'');
  const [translating,setTranslating]=useState(false);
  const [flashcards,setFlashcards]=useState([]);
  const [flashLoading,setFlashLoading]=useState(false);
  const [currentCard,setCurrentCard]=useState(0);
  const [cardFlipped,setCardFlipped]=useState(false);
  const [cardResults,setCardResults]=useState({});
  const [feynmanText,setFeynmanText]=useState('');
  const [feynmanResult,setFeynmanResult]=useState(null);
  const [feynmanLoading,setFeynmanLoading]=useState(false);
  const [quiz,setQuiz]=useState(null);
  const [quizLoading,setQuizLoading]=useState(false);
  const [quizAnswers,setQuizAnswers]=useState({});
  const [quizDone,setQuizDone]=useState(false);
  const [reasoningAnswers,setReasoningAnswers]=useState({});
  const [reasoningResults,setReasoningResults]=useState({});
  const [reasoningLoading,setReasoningLoading]=useState({});
  const [toast,setToast]=useState(null);
  const [earnedRead,setEarnedRead]=useState(false);

  const showToast=(msg,type='success')=>setToast({msg,type,key:Date.now()});
  const displayText = translation || chapter.content;

  // ═══ LECTURA VERIFICADA ═══
  const rkey=`${book?.id||'b'}_${chapter.id}`;
  const words=chapter.words||chapter.content.split(/\s+/).filter(Boolean).length;
  const minSecs=Math.max(30,Math.round(words/READ.FAST_WPM*60));
  const estMin=Math.max(1,Math.round(words/READ.EST_WPM));
  const paraO=chapter.content.split('\n\n'), paraT=translation?translation.split('\n\n'):[];
  const blank=()=>({secs:0,seenO:[],seenT:[],tts:0,tests:[],passed:false,retryAt:0,nextCheck:0});
  const [rlog,setRlog]=useState(()=>({...blank(),...((LS.get('sq_readlog',{})||{})[rkey]||{})}));
  const rlogRef=useRef(rlog); rlogRef.current=rlog;
  const saveLog=(upd)=>{ setRlog(prev=>{ const nx={...prev,...(typeof upd==='function'?upd(prev):upd)}; const all=LS.get('sq_readlog',{})||{}; all[rkey]=nx; LS.set('sq_readlog',all); return nx; }); };
  const [attention,setAttention]=useState(false);
  const attRef=useRef(false); attRef.current=attention;
  const tabRef=useRef(tab); tabRef.current=tab;
  const lastAct=useRef(Date.now());
  const studyRef=useRef(onStudy); studyRef.current=onStudy;
  const minuteAcc=useRef(0);
  useEffect(()=>{
    const bump=()=>{ lastAct.current=Date.now(); };
    const evs=['scroll','touchstart','pointerdown','keydown','wheel'];
    evs.forEach(e=>window.addEventListener(e,bump,{passive:true,capture:true}));
    if(!rlogRef.current.nextCheck) saveLog(p=>({nextCheck:p.secs+READ.CHECK_MIN+Math.round(Math.random()*(READ.CHECK_MAX-READ.CHECK_MIN))}));
    const iv=setInterval(()=>{
      if(tabRef.current!=='read' || attRef.current || document.visibilityState!=='visible') return;
      const speaking=window.speechSynthesis&&window.speechSynthesis.speaking;
      if(!(speaking || Date.now()-lastAct.current<45000)) return;
      const cur=rlogRef.current;
      if(cur.nextCheck && cur.secs>=cur.nextCheck){ setAttention(true); return; }
      saveLog(p=>({secs:p.secs+5}));
      minuteAcc.current+=5; if(minuteAcc.current>=60){ minuteAcc.current=0; studyRef.current('minute'); }
    },5000);
    return ()=>{ clearInterval(iv); evs.forEach(e=>window.removeEventListener(e,bump,{capture:true})); };
  },[rkey]);
  function confirmAttention(){
    setAttention(false); lastAct.current=Date.now();
    saveLog(p=>({nextCheck:p.secs+READ.CHECK_MIN+Math.round(Math.random()*(READ.CHECK_MAX-READ.CHECK_MIN))}));
  }
  // Párrafos que ya pasaron por la pantalla (su parte superior llegó al 85 % de la altura visible)
  const textRef=useRef(null);
  useEffect(()=>{
    const el=textRef.current; if(!el) return;
    const field=translation?'seenT':'seenO';
    let raf=0;
    const scan=()=>{ raf=0;
      const lim=window.innerHeight*0.85, idx=[];
      el.querySelectorAll('p[data-i]').forEach(p=>{ if(p.getBoundingClientRect().top<lim) idx.push(+p.dataset.i); });
      if(!idx.length) return;
      saveLog(pr=>{ const set=new Set(pr[field]||[]); let ch=false; idx.forEach(i=>{ if(!set.has(i)){ set.add(i); ch=true; } }); return ch?{[field]:[...set]}:{}; });
    };
    const onScroll=()=>{ if(!raf) raf=requestAnimationFrame(scan); };
    window.addEventListener('scroll',onScroll,{passive:true,capture:true});
    const t=setTimeout(scan,600);
    return ()=>{ window.removeEventListener('scroll',onScroll,{capture:true}); clearTimeout(t); if(raf) cancelAnimationFrame(raf); };
  },[rkey,translation,tab]);
  const covO=paraO.length?(rlog.seenO||[]).length/paraO.length:0;
  const covT=paraT.length?(rlog.seenT||[]).length/paraT.length:0;
  const coverage=Math.min(1,Math.max(covO,covT,rlog.tts||0));
  const seenWords=Math.round(words*coverage);
  const tooFast=rlog.secs>=10 && seenWords>(rlog.secs/60)*READ.MAX_WPM+120 && !rlog.passed;
  const timeOk=rlog.secs>=minSecs, covOk=coverage>=READ.COVERAGE, retryOk=rlog.secs>=(rlog.retryAt||0);
  const canTest=timeOk&&covOk&&retryOk&&!rlog.passed&&!alreadyDone;
  const fmt=(x)=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;
  const wpm=rlog.secs>30?Math.round(seenWords/(rlog.secs/60)):0;
  // Test de comprensión
  const [test,setTest]=useState(null); // {questions, answers, done, score}
  const [testLoading,setTestLoading]=useState(false);
  async function startTest(){
    if(!ai){ finishVerified(null,'Verificado por tiempo y avance (sin IA)'); return; }
    setTestLoading(true);
    try{
      const raw=await callClaude({apiKey,...PROMPTS.comprehension(displayText)});
      const j=JSON.parse(raw.replace(/```json?|```/g,'').trim());
      const qs=(j.questions||[]).slice(0,3).map(q=>{ const ord=q.options.map((o,i)=>({o,i})).sort(()=>Math.random()-0.5); return {q:q.q,why:q.why,options:ord.map(x=>x.o),correct:ord.findIndex(x=>x.i===q.correct)}; });
      if(qs.length<2) throw new Error('Preguntas incompletas');
      setTest({questions:qs,answers:{},done:false,score:0});
    }catch(err){ showToast('No se pudo crear el test: '+err.message,'error'); }
    finally{ setTestLoading(false); }
  }
  function submitTest(){
    const qs=test.questions, score=qs.filter((q,i)=>test.answers[i]===q.correct).length;
    const passed=score>=Math.min(READ.PASS,qs.length);
    setTest({...test,done:true,score});
    saveLog(p=>({tests:[...(p.tests||[]),{date:Date.now(),score,of:qs.length,secs:p.secs}]}));
    if(passed) finishVerified(score,`Test ${score}/${qs.length}`);
    else saveLog(p=>({retryAt:p.secs+120}));
  }
  function finishVerified(score,label){
    saveLog({passed:true,verifiedAt:Date.now(),wpm});
    markRead();
    if(score!==null && test && score===test.questions.length) setTimeout(()=>onEarnTokens(READ.PERFECT_BONUS,'🎯 Comprensión perfecta'),900);
  }
  const ttsProgress=(f)=>{ if(f>(rlogRef.current.tts||0)) saveLog({tts:f}); };

  // 🎙️ Feynman por voz (dictado)
  const SR = typeof window!=='undefined' ? (window.SpeechRecognition||window.webkitSpeechRecognition) : null;
  const recRef = useRef(null);
  const [listening,setListening]=useState(false);
  const [usedVoice,setUsedVoice]=useState(false);
  function toggleDictation(){
    if(!SR){ showToast('Tu navegador no permite dictado. Prueba Safari o Chrome.','error'); return; }
    if(listening){ try{recRef.current&&recRef.current.stop();}catch(e){} return; }
    const rec=new SR(); recRef.current=rec;
    rec.lang='es-ES'; rec.continuous=true; rec.interimResults=false;
    rec.onresult=(e)=>{ let txt=''; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) txt+=e.results[i][0].transcript; }
      if(txt.trim()){ setFeynmanText(t=>(t?t.trim()+' ':'')+txt.trim()); setUsedVoice(true); } };
    rec.onerror=(e)=>{ setListening(false); if(e.error==='not-allowed') showToast('Permite el micrófono para dictar','error'); };
    rec.onend=()=>setListening(false);
    try{ rec.start(); setListening(true); }catch(e){ setListening(false); }
  }
  useEffect(()=>()=>{ try{recRef.current&&recRef.current.stop();}catch(e){} },[]);

  async function translate(){
    if(!ai){showToast('Conecta la IA en Config (PIN o API Key)','error');return;}
    setTranslating(true);
    try{
      const words=chapter.content.split(/\s+/),cs=400;
      let result='';
      for(let i=0;i<Math.min(words.length,1200);i+=cs){
        const p=PROMPTS.translate(words.slice(i,i+cs).join(' '));
        result+=await callClaude({apiKey,...p})+'\n\n';
      }
      setTranslation(result.trim());
      AICache.set(cacheKey,{translation:result.trim()});
    }catch(err){showToast('Error: '+err.message,'error');}finally{setTranslating(false);}
  }

  function markRead(){ // llamado tras verificar la lectura
    if(!earnedRead && !alreadyDone){onEarnTokens(TOKENS.READ_CHAPTER,'Capítulo leído 📖');onStudy('chapter');}
    setEarnedRead(true);
    onComplete(chapter.id);
    if(!alreadyDone) showToast(`+${TOKENS.READ_CHAPTER} StudyTokens! 🎉`);
  }

  async function generateFlashcards(){
    if(!ai){showToast('Conecta la IA en Config (PIN o API Key)','error');return;}
    setFlashLoading(true);
    try{
      const p=PROMPTS.flashcards(chapter.content);
      const raw=await callClaude({apiKey,...p});
      const parsed=JSON.parse(raw.replace(/```json?|```/g,'').trim());
      const cards = parsed.cards || parsed.flashcards || (Array.isArray(parsed)?parsed:[]);
      console.log('Flashcards parsed:', cards.length, cards[0]);
      setFlashcards(cards);setCurrentCard(0);setCardFlipped(false);setCardResults({});
      onAddCards(cards,chapter,book);
    }catch(err){showToast('Error: '+err.message,'error');}finally{setFlashLoading(false);}
  }

  function nextCard(knew){
    setCardResults(r=>({...r,[currentCard]:knew}));
    if(currentCard<flashcards.length-1){setCurrentCard(c=>c+1);setCardFlipped(false);}
    else{const correct=Object.values({...cardResults,[currentCard]:knew}).filter(Boolean).length;onEarnTokens(correct*TOKENS.FLASHCARD,`Flashcards: ${correct}/${flashcards.length} ✅`);onStudy('flashcards');showToast(`+${correct*TOKENS.FLASHCARD} tokens! 🃏`);}
  }

  async function evaluateFeynman(){
    if(!ai){showToast('Conecta la IA en Config (PIN o API Key)','error');return;}
    if(feynmanText.trim().length<50){showToast('Escribe al menos 50 caracteres','error');return;}
    setFeynmanLoading(true);
    try{
      const p=PROMPTS.feynmanEval(chapter.content,feynmanText);
      const raw=await callClaude({apiKey,...p});
      const result=JSON.parse(raw.replace(/```json?|```/g,'').trim());
      setFeynmanResult(result);
      onSaveFeynman({chapter:chapter.title,score:result.score,date:Date.now()});
      const passed=result.score>=60;
      onStudy('feynman',{passed});
      if(passed){onEarnTokens(TOKENS.FEYNMAN,'Técnica Feynman ✅');showToast(`+${TOKENS.FEYNMAN} tokens! Feynman 🧠`);
        if(usedVoice){ setTimeout(()=>onEarnTokens(TOKENS.VOICE_FEYNMAN,'🎙️ Explicación con tu voz'),1200); onStudy('voice'); }}
    }catch(err){showToast('Error: '+err.message,'error');}finally{setFeynmanLoading(false);}
  }

  async function generateQuiz(){
    if(!ai){showToast('Conecta la IA en Config (PIN o API Key)','error');return;}
    setQuizLoading(true);
    try{
      const p=PROMPTS.quiz(chapter.content);
      const raw=await callClaude({apiKey,...p});
      setQuiz(JSON.parse(raw.replace(/```json?|```/g,'').trim()));
      setQuizAnswers({});setQuizDone(false);setReasoningAnswers({});setReasoningResults({});
    }catch(err){showToast('Error: '+err.message,'error');}finally{setQuizLoading(false);}
  }

  async function submitReasoning(qIdx,q,ideal,kw){
    const ans=reasoningAnswers[qIdx];
    if(!ans||ans.trim().length<20){showToast('Respuesta muy corta','error');return;}
    setReasoningLoading(l=>({...l,[qIdx]:true}));
    try{
      const p=PROMPTS.evalReasoning(q,ideal,kw,ans);
      const raw=await callClaude({apiKey,...p});
      setReasoningResults(r=>({...r,[qIdx]:JSON.parse(raw.replace(/```json?|```/g,'').trim())}));
    }catch(err){showToast('Error: '+err.message,'error');}finally{setReasoningLoading(l=>({...l,[qIdx]:false}));}
  }

  function finishQuiz(){
    const qs=quiz.questions||[];
    const mq=qs.filter(q=>q.type==='multiple');
    const correct=mq.filter((q,i)=>quizAnswers[i]===q.correct).length;
    const rp=Object.values(reasoningResults).filter(r=>r.passed).length;
    const pts=(correct+rp)*TOKENS.QUIZ_PASS;
    onEarnTokens(pts,`Quiz: ${correct}/${mq.length} correctas`);onStudy('quiz');
    showToast(`+${pts} tokens! Quiz 🏆`);
    setQuizDone(true);
  }

  const scoreColor=s=>s>=80?'#6ee7b7':s>=60?'#67e8f9':'#fca5a5';
  const evalBorderCls=l=>l==='Excelente'?'eval-excellent':l==='Bien'?'eval-good':'eval-poor';

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'12px 16px',background:'var(--surface2)',borderBottom:'1px solid rgba(51,65,85,0.4)',backdropFilter:'blur(12px)'}}>
        <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{chapter.title}</div>
        <div style={{fontSize:19,color:'#334155',marginTop:2}}>{chapter.words?.toLocaleString()} palabras · {book?.title}</div>
      </div>
      <div style={{padding:'12px 16px 0',background:'var(--surface)',borderBottom:'1px solid rgba(51,65,85,0.3)'}}>
        <div className="tab-bar">
          {[{id:'read',label:'📖 Leer'},{id:'flashcards',label:'🃏 Flashcards'},{id:'feynman',label:'🧠 Feynman'},{id:'quiz',label:'📝 Quiz'}].map(t=>(
            <button key={t.id} className={`tab-chip ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
          ))}
        </div>
      </div>
      <div className="scroll-area">

        {tab==='read'&&(
          <div className="fade-up">
            <div style={{display:'flex',gap:10,marginBottom:14}}>
              <button className="btn btn-secondary" style={{flex:1}} onClick={translate} disabled={translating}>
                {translating?<Spinner text="Traduciendo"/>:'🌐 Traducir al español'}
              </button>
            </div>
            <div className="glass-card" style={{padding:14,marginBottom:12,border:`1px solid ${(rlog.passed||alreadyDone)?'rgba(16,185,129,0.45)':'rgba(6,182,212,0.25)'}`}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <div className="font-display" style={{fontWeight:800,fontSize:16,color:'var(--text)'}}>{(rlog.passed||alreadyDone)?'✅ Lectura verificada':'📏 Verificación de lectura'}</div>
                <span style={{fontSize:13,color:'var(--muted)'}}>~{estMin} min · {words} palabras</span>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:10}}>
                {[{ic:'⏱️',lb:'Tiempo',v:fmt(rlog.secs),ok:timeOk,sub:`mín. ${fmt(minSecs)}`},{ic:'👁️',lb:'Leído',v:Math.round(coverage*100)+'%',ok:covOk,sub:`mín. ${Math.round(READ.COVERAGE*100)}%`},{ic:'⚡',lb:'Velocidad',v:wpm?wpm+' ppm':'—',ok:!tooFast,sub:`máx. ${READ.MAX_WPM}`}].map(x=>(
                  <div key={x.lb} style={{background:'var(--surface2)',borderRadius:10,padding:'8px 6px',textAlign:'center',border:`1px solid ${x.ok?'rgba(16,185,129,0.35)':'var(--border)'}`}}>
                    <div style={{fontSize:12,color:'var(--muted)'}}>{x.ic} {x.lb}</div>
                    <div className="font-display" style={{fontWeight:800,fontSize:17,color:x.ok?'#6ee7b7':'var(--text)'}}>{x.v}</div>
                    <div style={{fontSize:11,color:'var(--muted)'}}>{x.sub}</div>
                  </div>
                ))}
              </div>
              <div className="progress-track" style={{height:6,marginBottom:10}}><div style={{height:'100%',borderRadius:3,width:`${Math.min(100,Math.round((Math.min(1,rlog.secs/minSecs)*0.5+Math.min(1,coverage/READ.COVERAGE)*0.5)*100))}%`,background:'linear-gradient(90deg,#06b6d4,#10b981)'}}/></div>
              {tooFast&&<div style={{fontSize:13,color:'#fcd34d',marginBottom:8}}>⚡ Vas más rápido de lo que se puede leer con atención. El tiempo sigue contando: lee con calma.</div>}
              {(rlog.passed||alreadyDone)?(
                <div style={{fontSize:14,color:'#6ee7b7'}}>Capítulo leído{(rlog.tests||[]).length?` · test ${rlog.tests[rlog.tests.length-1].score}/${rlog.tests[rlog.tests.length-1].of}`:''} · +{TOKENS.READ_CHAPTER} 🪙 cobrados</div>
              ):(
                <button className={`btn btn-full ${canTest?'btn-success':'btn-secondary'}`} disabled={!canTest||testLoading} onClick={startTest}>
                  {testLoading?<Spinner text="Preparando test"/>:canTest?`🧪 Test de comprensión → +${TOKENS.READ_CHAPTER} 🪙`:
                    !retryOk?`Repasa un poco más: test disponible en ${fmt((rlog.retryAt||0)-rlog.secs)}`:
                    !timeOk?`Sigue leyendo: faltan ${fmt(minSecs-rlog.secs)}`:`Llega al final del capítulo (${Math.round(coverage*100)}%)`}
                </button>
              )}
            </div>
            {attention&&ReactDOM.createPortal(
              <div className="modal-overlay" style={{alignItems:'center',zIndex:250}}>
                <div style={{width:'calc(100% - 40px)',maxWidth:380,background:'linear-gradient(180deg,#1c1407,#0f172a)',border:'2px solid #f59e0b',borderRadius:22,padding:24,textAlign:'center'}}>
                  <div style={{fontSize:42,marginBottom:6}}>⏸️</div>
                  <div className="font-display" style={{fontWeight:800,fontSize:20,color:'#fcd34d',marginBottom:6}}>¿Sigues leyendo?</div>
                  <div style={{fontSize:15,color:'#cbd5e1',marginBottom:16,lineHeight:1.5}}>El tiempo está en pausa hasta que confirmes.</div>
                  <button className="btn btn-gold btn-full btn-lg" onClick={confirmAttention}>Sí, sigo aquí</button>
                </div>
              </div>, document.body
            )}
            <div style={{position:'sticky',top:-20,zIndex:6,margin:'0 -16px 10px',padding:'8px 16px',background:'var(--bg)',borderBottom:'1px solid rgba(51,65,85,0.4)',display:'flex',alignItems:'center',gap:10,fontSize:14,color:'var(--muted)'}}>
              <span style={{color:timeOk?'#6ee7b7':'var(--text)',fontWeight:700}}>⏱️ {fmt(rlog.secs)}<span style={{fontWeight:400,color:'var(--muted)'}}>/{fmt(minSecs)}</span></span>
              <span style={{color:covOk?'#6ee7b7':'var(--text)',fontWeight:700}}>👁️ {Math.round(coverage*100)}%</span>
              {tooFast&&<span style={{color:'#fcd34d',fontWeight:700}}>⚡ despacio</span>}
              <div className="progress-track" style={{flex:1,height:5}}><div style={{height:'100%',borderRadius:3,width:`${Math.min(100,Math.round((Math.min(1,rlog.secs/minSecs)*0.5+Math.min(1,coverage/READ.COVERAGE)*0.5)*100))}%`,background:(rlog.passed||alreadyDone)?'#10b981':'linear-gradient(90deg,#06b6d4,#10b981)'}}/></div>
              {(rlog.passed||alreadyDone)&&<span style={{color:'#6ee7b7'}}>✅</span>}
            </div>
            <TTSBar text={displayText} onProgress={ttsProgress}/>
            <div className="glass-card" style={{padding:20}}>
              {translation?(
                <>
                  <div style={{fontSize:19,color:'#06b6d4',marginBottom:14,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.8px'}}>Traducción al español</div>
                  <div className="reading-text" ref={textRef}>{paraT.map((p,i)=><p key={i} data-i={i}>{p}</p>)}</div>
                </>
              ):(
                <>
                  <div style={{fontSize:19,color:'#334155',marginBottom:14,fontWeight:600,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.8px'}}>Texto original</div>
                  <div className="reading-text" ref={textRef}>
                    {paraO.map((p,i)=><p key={i} data-i={i}>{p}</p>)}
                  </div>
                </>
              )}
            </div>
            {!(rlog.passed||alreadyDone)&&(
              <div className="glass-card" style={{padding:16,marginTop:14,textAlign:'center'}}>
                <div className="font-display" style={{fontWeight:800,fontSize:17,color:'var(--text)',marginBottom:10}}>🏁 Fin del capítulo</div>
                <button className={`btn btn-full ${canTest?'btn-success':'btn-secondary'}`} disabled={!canTest||testLoading} onClick={startTest}>
                  {testLoading?<Spinner text="Preparando test"/>:canTest?`🧪 Test de comprensión → +${TOKENS.READ_CHAPTER} 🪙`:
                    !retryOk?`Repasa un poco más: test en ${fmt((rlog.retryAt||0)-rlog.secs)}`:
                    !timeOk?`Tiempo de lectura: faltan ${fmt(minSecs-rlog.secs)}`:`Leído ${Math.round(coverage*100)}% — revisa lo que saltaste`}
                </button>
              </div>
            )}
          </div>
        )}

        {test&&(
          <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&test.done&&setTest(null)}>
            <div className="modal-sheet" style={{maxHeight:'85vh',overflowY:'auto'}}>
              <div className="modal-handle"/>
              <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:4}}>🧪 Test de comprensión</div>
              <div style={{fontSize:14,color:'var(--muted)',marginBottom:14}}>Responde sin mirar el texto. Necesitas {Math.min(READ.PASS,test.questions.length)} de {test.questions.length}.</div>
              {test.questions.map((q,qi)=>(
                <div key={qi} style={{marginBottom:14}}>
                  <div style={{fontWeight:700,fontSize:16,color:'var(--text)',marginBottom:8,lineHeight:1.45}}>{qi+1}. {q.q}</div>
                  {q.options.map((o,oi)=>{
                    const sel=test.answers[qi]===oi, right=test.done&&oi===q.correct, wrong=test.done&&sel&&oi!==q.correct;
                    return <button key={oi} disabled={test.done} onClick={()=>setTest(t=>({...t,answers:{...t.answers,[qi]:oi}}))}
                      style={{display:'block',width:'100%',textAlign:'left',padding:'10px 12px',marginBottom:6,borderRadius:10,cursor:'pointer',fontSize:15,lineHeight:1.4,
                        border:`1.5px solid ${right?'#10b981':wrong?'#ef4444':sel?'#06b6d4':'var(--border)'}`,background:right?'rgba(16,185,129,0.12)':wrong?'rgba(239,68,68,0.1)':sel?'rgba(6,182,212,0.1)':'var(--surface2)',color:'var(--text)'}}>{o}</button>;
                  })}
                  {test.done&&q.why&&<div style={{fontSize:13,color:'var(--muted)',fontStyle:'italic'}}>📖 {q.why}</div>}
                </div>
              ))}
              {!test.done?(
                <button className="btn btn-primary btn-full" disabled={Object.keys(test.answers).length<test.questions.length} onClick={submitTest}>Comprobar respuestas</button>
              ):(
                <>
                  <div style={{textAlign:'center',fontSize:17,fontWeight:800,margin:'6px 0 12px',color:test.score>=Math.min(READ.PASS,test.questions.length)?'#6ee7b7':'#fca5a5'}}>
                    {test.score>=Math.min(READ.PASS,test.questions.length)?`✅ ${test.score}/${test.questions.length} · ¡Lectura verificada! +${TOKENS.READ_CHAPTER} 🪙${test.score===test.questions.length?` +${READ.PERFECT_BONUS}`:''}`:`✗ ${test.score}/${test.questions.length} · Repasa el capítulo; podrás reintentar en 2 min de lectura`}
                  </div>
                  <button className="btn btn-secondary btn-full" onClick={()=>setTest(null)}>Cerrar</button>
                </>
              )}
            </div>
          </div>
        )}

        {tab==='flashcards'&&(
          <div className="fade-up">
            {flashcards.length===0?(
              <div style={{textAlign:'center',paddingTop:40}}>
                <div style={{fontSize:56,marginBottom:16}}>🃏</div>
                <div className="font-display" style={{fontWeight:800,fontSize:22,color:'var(--text)',marginBottom:8}}>Active Recall</div>
                <div style={{fontSize:19,color:'var(--muted)',marginBottom:28}}>Flashcards inteligentes generadas con IA</div>
                <button className="btn btn-primary btn-lg" onClick={generateFlashcards} disabled={flashLoading}>
                  {flashLoading?<Spinner text="Generando"/>:'⚡ Generar Flashcards'}
                </button>
              </div>
            ):(
              <>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                  <span style={{fontSize:19,color:'var(--muted)',fontFamily:'Plus Jakarta Sans',fontWeight:600}}>Tarjeta {currentCard+1} / {flashcards.length}</span>
                  <button className="btn btn-secondary btn-sm" onClick={generateFlashcards}><Icons.Refresh/> Nueva tanda</button>
                </div>
                <div className="progress-track" style={{marginBottom:18}}>
                  <div className="progress-fill-cyan" style={{width:`${(currentCard/flashcards.length)*100}%`}}/>
                </div>
                {currentCard<flashcards.length?(
                  <>
                    <div className={`flashcard ${cardFlipped?'flipped':''}`} onClick={()=>setCardFlipped(f=>!f)}>
                      <div className="flashcard-inner">
                        <div className="flashcard-front">
                          <div style={{fontSize:19,color:'#67e8f9',marginBottom:14,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.8px'}}>❓ Pregunta</div>
                          <div className="font-display" style={{fontWeight:700,fontSize:18,color:'#f1f5f9',lineHeight:1.5}}>{flashcards[currentCard]?.q}</div>
                          <div style={{fontSize:19,color:'#94a3b8',marginTop:18}}>Toca para ver respuesta</div>
                        </div>
                        <div className="flashcard-back">
                          <div style={{fontSize:19,color:'#6ee7b7',marginBottom:14,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.8px'}}>✅ Respuesta</div>
                          <div className="answer-text" style={{fontSize:18,lineHeight:1.65,color:'#e2e8f0'}}>{flashcards[currentCard]?.a}</div>
                        </div>
                      </div>
                    </div>
                    {cardFlipped&&(
                      <div style={{display:'flex',gap:12,marginTop:16}} className="fade-in">
                        <button className="btn btn-danger" style={{flex:1}} onClick={()=>nextCard(false)}><Icons.X/> No sabía</button>
                        <button className="btn btn-success" style={{flex:1}} onClick={()=>nextCard(true)}><Icons.Check/> Lo sabía</button>
                      </div>
                    )}
                  </>
                ):(
                  <div className="glass-card" style={{textAlign:'center',padding:36}}>
                    <div style={{fontSize:44,marginBottom:10}}>🎉</div>
                    <div className="font-display" style={{fontWeight:800,fontSize:20,color:'var(--text)',marginBottom:8}}>¡Completado!</div>
                    <div style={{fontSize:19,color:'var(--muted)',marginBottom:20}}>{Object.values(cardResults).filter(Boolean).length}/{flashcards.length} correctas</div>
                    <button className="btn btn-primary" onClick={()=>{setCurrentCard(0);setCardFlipped(false);setCardResults({});}}><Icons.Refresh/> Repetir</button>
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {tab==='feynman'&&(
          <div className="fade-up">
            <div className="glass-card-cyan" style={{padding:18,marginBottom:16}}>
              <div className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)',marginBottom:6}}>🧠 Técnica Feynman</div>
              <div style={{fontSize:19,color:'var(--muted)',lineHeight:1.7}}>Explica el capítulo como si enseñaras a alguien sin conocimiento previo.</div>
            </div>
            {feynmanResult&&(
              <div className={`glass-card ${evalBorderCls(feynmanResult.level)}`} style={{padding:20,marginBottom:16,borderWidth:2}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                  <span className="font-display" style={{fontWeight:800,fontSize:18,color:'var(--text)'}}>{feynmanResult.level}</span>
                  <span className="font-display" style={{fontWeight:800,fontSize:28,color:scoreColor(feynmanResult.score)}}>{feynmanResult.score}<span style={{fontSize:18,color:'#475569'}}>/100</span></span>
                </div>
                {feynmanResult.concepts_mastered?.length>0&&(
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:19,color:'#10b981',marginBottom:6,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase'}}>✅ Dominado</div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{feynmanResult.concepts_mastered.map((c,i)=><span key={i} className="badge badge-green">{c}</span>)}</div>
                  </div>
                )}
                {feynmanResult.concepts_missing?.length>0&&(
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:19,color:'#ef4444',marginBottom:6,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase'}}>⚠️ Falta profundizar</div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{feynmanResult.concepts_missing.map((c,i)=><span key={i} className="badge badge-red">{c}</span>)}</div>
                  </div>
                )}
                <hr className="neon-sep"/>
                <div style={{fontSize:19,lineHeight:1.75,color:'#94a3b8',marginBottom:12}}>{feynmanResult.feedback}</div>
                {feynmanResult.improvement&&(
                  <div style={{padding:'12px 14px',background:'rgba(6,182,212,0.06)',borderRadius:10,fontSize:18,color:'#67e8f9',lineHeight:1.7,border:'1px solid rgba(6,182,212,0.15)',marginBottom:12}}>
                    💡 {feynmanResult.improvement}
                  </div>
                )}
                <button className="btn btn-secondary btn-sm" onClick={()=>exportFeynmanPDF(chapter,feynmanText,feynmanResult)}>
                  <Icons.Download/> Exportar análisis
                </button>
              </div>
            )}
            <button className={`btn btn-full ${listening?'btn-danger':'btn-secondary'}`} style={{marginBottom:10}} onClick={toggleDictation}>
              {listening?'⏹ Detener dictado':`🎙️ Explicar con mi voz (+${TOKENS.VOICE_FEYNMAN} extra)`}
            </button>
            {listening&&<div style={{fontSize:14,color:'#fca5a5',marginBottom:8}}>● Escuchando… habla como si se lo explicaras a un niño.</div>}
            <textarea className="input" placeholder="Escribe o dicta tu explicación del capítulo…" value={feynmanText} onChange={e=>setFeynmanText(e.target.value)} style={{minHeight:180,marginBottom:10}}/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <span style={{fontSize:18,color:'var(--muted)'}}>{feynmanText.length} caracteres</span>
              {feynmanText.length>=50&&<span className="badge badge-green">Listo para evaluar</span>}
            </div>
            <button className="btn btn-primary btn-full btn-lg" onClick={evaluateFeynman} disabled={feynmanLoading||feynmanText.length<50}>
              {feynmanLoading?<Spinner text="Evaluando con Sonnet"/>:`🎯 Evaluar (+${TOKENS.FEYNMAN} tokens)`}
            </button>
          </div>
        )}

        {tab==='quiz'&&(
          <div className="fade-up">
            {!quiz?(
              <div style={{textAlign:'center',paddingTop:40}}>
                <div style={{fontSize:56,marginBottom:16}}>📝</div>
                <div className="font-display" style={{fontWeight:800,fontSize:22,color:'var(--text)',marginBottom:8}}>Evaluación Final</div>
                <div style={{fontSize:19,color:'var(--muted)',marginBottom:28,lineHeight:1.7}}>Quiz con opción múltiple + razonamiento profundo</div>
                <button className="btn btn-primary btn-lg" onClick={generateQuiz} disabled={quizLoading}>
                  {quizLoading?<Spinner text="Generando quiz"/>:'🚀 Generar quiz del capítulo'}
                </button>
              </div>
            ):(
              <>
                {quiz.questions?.map((q,qIdx)=>(
                  <div key={qIdx} className="glass-card" style={{padding:18,marginBottom:14}}>
                    <div style={{fontSize:19,color:'#06b6d4',marginBottom:8,fontWeight:700,fontFamily:'Plus Jakarta Sans',textTransform:'uppercase',letterSpacing:'0.6px'}}>{q.type==='multiple'?'Opción múltiple':'Razonamiento'} · {qIdx+1}</div>
                    <div className="font-display" style={{fontWeight:700,fontSize:18,color:'var(--text)',lineHeight:1.55,marginBottom:14}}>{q.question}</div>
                    {q.type==='multiple'&&(
                      <>
                        {q.options?.map((opt,oIdx)=>{const answered=quizAnswers[qIdx]!==undefined;const sel=quizAnswers[qIdx]===oIdx,correct=oIdx===q.correct;let cls='quiz-option';if(answered&&correct)cls+=' correct';else if(answered&&sel&&!correct)cls+=' wrong';return<button key={oIdx} className={cls} onClick={()=>!answered&&setQuizAnswers(a=>({...a,[qIdx]:oIdx}))} disabled={answered}>{opt}</button>;})}
                        {quizAnswers[qIdx]!==undefined&&q.explanation&&(<div style={{marginTop:10,padding:'10px 14px',background:'rgba(16,185,129,0.06)',borderRadius:10,fontSize:18,color:'#6ee7b7',lineHeight:1.7,border:'1px solid rgba(16,185,129,0.15)'}}>💡 {q.explanation}</div>)}
                      </>
                    )}
                    {q.type==='reasoning'&&(
                      <>
                        <textarea className="input" placeholder="Escribe tu respuesta…" value={reasoningAnswers[qIdx]||''} onChange={e=>setReasoningAnswers(a=>({...a,[qIdx]:e.target.value}))} style={{minHeight:100,marginBottom:10}} disabled={!!reasoningResults[qIdx]}/>
                        {!reasoningResults[qIdx]?(
                          <button className="btn btn-secondary btn-sm" onClick={()=>submitReasoning(qIdx,q.question,q.ideal_answer,q.keywords||[])} disabled={reasoningLoading[qIdx]||(reasoningAnswers[qIdx]||'').length<20}>
                            {reasoningLoading[qIdx]?<Spinner text="Evaluando"/>:'Evaluar respuesta'}
                          </button>
                        ):(
                          <div style={{padding:'12px 14px',background:reasoningResults[qIdx].passed?'rgba(16,185,129,0.07)':'rgba(239,68,68,0.07)',borderRadius:10,border:`1px solid ${reasoningResults[qIdx].passed?'rgba(16,185,129,0.25)':'rgba(239,68,68,0.25)'}`}}>
                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span className="font-display" style={{fontWeight:700,fontSize:19,color:reasoningResults[qIdx].passed?'#6ee7b7':'#fca5a5'}}>{reasoningResults[qIdx].passed?'✅ Aprobado':'❌ Incompleto'}</span><span style={{color:reasoningResults[qIdx].passed?'#6ee7b7':'#fca5a5',fontWeight:700}}>{reasoningResults[qIdx].score}/100</span></div>
                            <div style={{fontSize:18,color:'#64748b',lineHeight:1.7}}>{reasoningResults[qIdx].feedback}</div>
                          </div>
                        )}
                      </>
                    )}
                  </div>
                ))}
                {!quizDone&&<button className="btn btn-gold btn-full btn-lg" style={{marginTop:8}} onClick={finishQuiz}>✅ Finalizar y ganar tokens</button>}
                {quizDone&&(<div className="glass-card" style={{textAlign:'center',padding:32}}><div style={{fontSize:44,marginBottom:10}}>🏆</div><div className="font-display" style={{fontWeight:800,fontSize:20,color:'var(--text)'}}>¡Quiz completado!</div><button className="btn btn-secondary btn-sm" style={{marginTop:14}} onClick={generateQuiz}><Icons.Refresh/> Nuevo quiz</button></div>)}
              </>
            )}
          </div>
        )}
      </div>
      {toast&&<Toast key={toast.key} message={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
    </div>
  );
}

// ═══ VOICE SETTINGS COMPONENT ═══
function VoiceSettings() {
  const [allVoices, setAllVoices] = useState([]);
  const [selectedVoiceName, setSelectedVoiceName] = useState(() => LS.get('sq_tts_voicename',''));
  const [rawVoices, setRawVoices] = useState([]);
  const [showAll, setShowAll] = useState(false);
  const [pitch, setPitchState] = useState(() => Number(LS.get('sq_tts_pitch', 1)) || 1);
  const setPitch = (p) => { const v = Math.round(Math.min(1.6, Math.max(0.5, p)) * 100) / 100; setPitchState(v); LS.set('sq_tts_pitch', v); };
  const testPitch = (p) => {
    try { const v = allVoices.find(x => x.name === selectedVoiceName) || allVoices[0]; const synth = window.speechSynthesis; if (!v || !synth) return;
      synth.cancel(); const u = new SpeechSynthesisUtterance(v.lang.startsWith('es') ? 'Así suena el tono que elegiste.' : 'This is the pitch you chose.'); u.voice = v; u.lang = v.lang; u.pitch = p; synth.speak(u); } catch (e) {}
  };

  useEffect(() => {
    function load() {
      const v = window.speechSynthesis?.getVoices() || [];
      if(v.length > 0) {
        setRawVoices(v.filter(x=>/^(es|en)/i.test(x.lang||'')));
        setAllVoices(curateVoices(v));
      }
    }
    load();
    window.speechSynthesis?.addEventListener('voiceschanged', load);
    // iOS retry
    let attempts = 0;
    const retry = setInterval(() => {
      attempts++; load();
      if(attempts >= 10 || window.speechSynthesis?.getVoices().length > 0) clearInterval(retry);
    }, 300);
    return () => {
      window.speechSynthesis?.removeEventListener('voiceschanged', load);
      clearInterval(retry);
    };
  }, []);

  function selectVoice(name) {
    setSelectedVoiceName(name);
    LS.set('sq_tts_voicename', name);
    window.dispatchEvent(new Event('tts-voice-changed'));
    try {
      const v = [...allVoices, ...rawVoices].find(x => x.name === name); const synth = window.speechSynthesis;
      if (v && synth) { synth.cancel(); const u = new SpeechSynthesisUtterance(v.lang.startsWith('es') ? 'Hola, así sueno leyendo tus libros.' : 'Hi, this is how I sound reading your books.'); u.voice = v; u.lang = v.lang; u.pitch = pitch; synth.speak(u); }
    } catch (e) {}
  }

  const esVoices = allVoices.filter(v => v.lang.startsWith('es'));
  const enVoices = allVoices.filter(v => v.lang.startsWith('en'));
  // Only show other voices if they are useful (exclude Indonesian, etc.)
  const ALLOWED_OTHER = ['fr','pt','de','it','ca'];
  const otherVoices = allVoices.filter(v => !v.lang.startsWith('es') && !v.lang.startsWith('en') && ALLOWED_OTHER.some(l => v.lang.startsWith(l)));

  const VoiceButton = ({ v, accentColor='#06b6d4' }) => {
    const active = selectedVoiceName === v.name;
    const gender = guessGender(v.name);
    // Detect accent from lang
    let accent = '';
    if(v.lang==='es-ES'||v.lang==='es_ES') accent='🇪🇸';
    else if(v.lang.startsWith('es-MX')||v.lang==='es_MX') accent='🇲🇽';
    else if(v.lang.startsWith('es-AR')) accent='🇦🇷';
    else if(v.lang.startsWith('es-CO')) accent='🇨🇴';
    else if(v.lang.startsWith('es-CL')) accent='🇨🇱';
    else if(v.lang.startsWith('es-US')) accent='🌎';
    else if(v.lang.startsWith('es')) accent='🌍';
    else if(v.lang==='en-GB'||v.lang==='en_GB') accent='🇬🇧';
    else if(v.lang.startsWith('en-AU')) accent='🇦🇺';
    else if(v.lang.startsWith('en-US')||v.lang==='en_US') accent='🇺🇸';
    else if(v.lang.startsWith('en')) accent='🌐';

    return (
      <button onClick={()=>selectVoice(v.name)}
        style={{display:'flex',alignItems:'center',gap:10,width:'100%',padding:'11px 14px',borderRadius:12,border:`1.5px solid ${active?accentColor:'var(--border)'}`,background:active?`${accentColor}18`:'var(--surface2)',cursor:'pointer',textAlign:'left',transition:'all 0.15s',marginBottom:6}}>
        <span style={{fontSize:20}}>{accent}</span>
        <span style={{fontSize:18}}>{gender==='female'?'👩':'👨'}</span>
        <div style={{flex:1}}>
          <div className="font-display" style={{fontWeight:700,fontSize:19,color:active?accentColor:'var(--text)'}}>{voiceLabel(v)}</div>
          <div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{v.lang} · {gender==='female'?'Femenina':'Masculino'}{v.localService?' · Local':' · Online'}</div>
        </div>
        {active && <span style={{color:accentColor,fontSize:21,fontWeight:800}}>✓</span>}
      </button>
    );
  };

  if(allVoices.length === 0) return (
    <div className="glass-card" style={{padding:20,marginBottom:16,textAlign:'center'}}>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:6}}>Voces del sistema: {(window.speechSynthesis?.getVoices()||[]).length}</div>
      <div style={{fontSize:19,color:'var(--muted)'}}>🔊 Cargando voces del sistema...</div>
      <div style={{fontSize:19,color:'var(--muted)',marginTop:8,lineHeight:1.6}}>
        Si no aparecen voces en español, instálalas en:<br/>
        <strong>Android:</strong> Ajustes → Accesibilidad → Texto a voz → Instalar datos de voz<br/>
        <strong>iOS:</strong> Ajustes → Accesibilidad → Contenido hablado → Voces
      </div>
    </div>
  );

  return (
    <div className="glass-card" style={{padding:20,marginBottom:16}}>
      <div className="font-display" style={{fontWeight:800,fontSize:19,color:'var(--text)',marginBottom:4}}>🔊 Voz de Lectura</div>
      <div style={{fontSize:18,color:'var(--muted)',marginBottom:14}}>
        Las 2 mejores voces de mujer y de hombre de tu dispositivo · toca una para probarla
      </div>

      <div style={{background:'var(--surface2)',borderRadius:14,padding:'14px 14px 10px',marginBottom:16,border:'1px solid var(--border)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <span className="font-display" style={{fontWeight:700,fontSize:17,color:'var(--text)'}}>🎚️ Tono de voz</span>
          <span style={{fontSize:15,color:'#67e8f9',fontWeight:700}}>{pitch<0.85?'Grave':pitch>1.15?'Aguda':'Normal'} · {pitch.toFixed(2)}</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:12}}>
          {[{l:'🔉 Grave',v:0.7},{l:'🔊 Normal',v:1},{l:'🔔 Aguda',v:1.3}].map(o=>(
            <button key={o.v} className={`btn btn-sm ${Math.abs(pitch-o.v)<0.01?'btn-primary':'btn-secondary'}`} onClick={()=>{setPitch(o.v);testPitch(o.v);}}>{o.l}</button>
          ))}
        </div>
        <input type="range" min="0.5" max="1.6" step="0.05" value={pitch} onChange={e=>setPitch(parseFloat(e.target.value))} onPointerUp={e=>testPitch(parseFloat(e.target.value))} onTouchEnd={e=>testPitch(parseFloat(e.target.value))} style={{width:'100%',accentColor:'#06b6d4'}}/>
        <div style={{fontSize:13,color:'var(--muted)',marginTop:4}}>Con Mónica o Paulina en "Grave" consigues una voz más profunda.</div>
      </div>

      {esVoices.length > 0 && (
        <>
          <div style={{fontSize:19,color:'#06b6d4',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.6px',marginBottom:8}}>
            🌍 Español — {esVoices.length} voz(ces)
          </div>
          {esVoices.map(v => <VoiceButton key={v.name} v={v} accentColor="#06b6d4"/>)}
        </>
      )}

      {esVoices.length >= 2 && !esVoices.some(v=>VOICE_GENDER[v.name]==='male'&&!VOICE_ELOQ[deaccent(v.name).split(/[\s(]/)[0]]) && (
        <div style={{padding:'12px 14px',background:'rgba(6,182,212,0.08)',border:'1px solid rgba(6,182,212,0.25)',borderRadius:10,marginBottom:12,fontSize:16,color:'#67e8f9',lineHeight:1.7}}>
          👨 Para tener voces de hombre naturales en español, descárgalas gratis:<br/>
          <strong>iPhone →</strong> Ajustes → Accesibilidad → Contenido leído → Voces → Español → <em>Jorge</em> y <em>Juan</em> (elige "Mejorada" si aparece). Luego cierra y abre la app.
        </div>
      )}
      {esVoices.length < 2 && (
        <div style={{padding:'12px 14px',background:'rgba(245,158,11,0.08)',border:'1px solid rgba(245,158,11,0.25)',borderRadius:10,marginBottom:12,fontSize:18,color:'#fcd34d',lineHeight:1.8}}>
          {esVoices.length === 0 ? '⚠️ No hay voces en español.' : '💡 Solo hay 1 voz en español. Instala más:'}<br/>
          <strong>iPhone →</strong> Ajustes → Accesibilidad → Contenido hablado → Voces<br/>
          🇪🇸 <strong>Español (España):</strong> descarga <em>Lucía</em> (mujer) y <em>Jorge</em> (hombre)<br/>
          🇲🇽 <strong>Español (México):</strong> descarga <em>Paulina</em> (mujer) y <em>Juan</em> (hombre)
        </div>
      )}

      {enVoices.length > 0 && (
        <>
          <hr className="neon-sep"/>
          <div style={{fontSize:19,color:'#f59e0b',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.6px',marginBottom:8}}>
            🌐 English — {enVoices.length} voice(s)
          </div>
          {enVoices.map(v => <VoiceButton key={v.name} v={v} accentColor="#f59e0b"/>)}
        </>
      )}


      <hr className="neon-sep"/>
      <button className="btn btn-secondary btn-sm" onClick={()=>setShowAll(x=>!x)}>{showAll?'Ocultar':'Ver todas las voces'} ({rawVoices.length})</button>
